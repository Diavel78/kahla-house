name: Football Sheets — Sync to production DB

# Manual/on-demand version of the sync step baked into
# football-sheets-data.yml. Use this after football_sheet_render.py runs
# (in the CCR Routine session, which can't reach thekahlahouse.com at
# all) to push the freshly-stamped pdf_path/picks_pdf_path/published_at
# onto football_sheet_weeks in the DB the site actually reads
# (db.thekahlahouse.com, since the Cellar cutover moved Vercel's
# SUPABASE_URL there while this pipeline still writes the original cloud
# Supabase project). See docs/football-sheet-runbook.md.
#
# Required repo secrets: SUPABASE_URL, SUPABASE_SERVICE_KEY (the CLOUD
# project — same ones football-sheets-data.yml uses), FILLS_CRON_SECRET.

on:
  workflow_dispatch:
    inputs:
      sport:
        description: "NFL, NCAAF, or blank for both"
        required: false
        default: ""
      week_key:
        description: "Week key YYYY-MM-DD, or blank for whatever's latest"
        required: false
        default: ""

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: kahla-scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: kahla-scanner/requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Sync
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FILLS_CRON_SECRET:    ${{ secrets.FILLS_CRON_SECRET }}
        run: |
          SPORTS="${{ github.event.inputs.sport }}"
          WK="${{ github.event.inputs.week_key }}"
          ARGS=()
          if [ -n "$SPORTS" ]; then ARGS+=(--sport "$SPORTS"); else ARGS+=(--sport NFL --sport NCAAF); fi
          if [ -n "$WK" ]; then ARGS+=(--week-key "$WK"); else ARGS+=(--latest); fi
          python -m scripts.football_sheet_sync "${ARGS[@]}"
