name: NHL Goalies — Ingest

# Crease IQ Phase 1: per-game goalie logs (starter flag, saves/shots,
# decision) from the official NHL API into nhl_goalie_games.
#   probe    — reachability + boxscore shape verification, no writes.
#   backfill — 2024-09-15 → today (~2 seasons + playoffs, ~15 min).
#   delta    — last 4 days (the daily in-season default; off-season the
#              schedule returns nothing and the run is a no-op).
#
# Required repo secrets: SUPABASE_URL, SUPABASE_SERVICE_KEY.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe | backfill | delta"
        required: false
        default: "delta"
      start:
        description: "backfill start date (YYYY-MM-DD; default 2024-09-15)"
        required: false
        default: ""
  schedule:
    - cron: "0 10 * * *"

concurrency:
  group: nhl-goalies-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: kahla-scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: kahla-scanner/requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run ingest
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'delta' }}"
          echo "mode=$MODE"
          case "$MODE" in
            probe)    python -m scripts.ingest_nhl_goalies --probe ;;
            backfill)
              START="${{ github.event.inputs.start }}"
              if [ -n "$START" ]; then
                python -m scripts.ingest_nhl_goalies --backfill --start "$START" --commit
              else
                python -m scripts.ingest_nhl_goalies --backfill --commit
              fi ;;
            delta|*)  python -m scripts.ingest_nhl_goalies --delta --commit ;;
          esac
