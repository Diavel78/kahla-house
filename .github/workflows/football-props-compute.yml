name: Football Props — Compute

# Standby/dispatch: serialize the NFL props model state ->
# football_props_snapshot (per-player decayed mean/SD + league priors,
# the gate-1 backtest's mirror). The daily run lives on the cellar batch
# lane (cellar/batch.py, 3:52) — this stays runnable by hand for
# backfills and while the box is down. No schedule, on purpose (the
# cellar_lease does not protect against Actions firing).
#
# Required repo secrets: SUPABASE_URL, SUPABASE_SERVICE_KEY.

on:
  workflow_dispatch:

concurrency:
  group: football-props-compute
  cancel-in-progress: false

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kahla-scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: kahla-scanner/requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Build snapshot
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m scripts.compute_football_props --commit
