name: NHL Shots — Ingest

# Crease IQ P3 (xG spine): per-shot play-by-play events with rink
# coordinates from the free NHL API, into nhl_shot_events. Game universe
# comes from nhl_goalie_games (the P1 spine), so run the goalie ingest
# first. Probe-first — field names verified from the Action log before
# any backfill.
#   probe    — one completed game's shape verification, no writes.
#   backfill — every goalie-spine game not yet ingested (~2h cold).
#   delta    — same incremental walk (daily default; off-season no-op).
#
# Required repo secrets: SUPABASE_URL, SUPABASE_SERVICE_KEY.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe | backfill | delta"
        required: false
        default: "delta"
  # ── SCHEDULE DISABLED 2026-08-17 — THE CELLAR OWNS THIS JOB ──────────────
  # Runs from the house box instead (cellar/batch.py, `batch` lane). The
  # cellar_lease does NOT protect against GitHub Actions — Actions claims
  # nothing, it just fires — so leaving this cron on means the job runs twice
  # a day. Verified first: 12/12 jobs ran unattended from the cellar overnight.
  #
  # workflow_dispatch is deliberately KEPT: this workflow remains the standby
  # and stays runnable by hand. Disable, never delete (spec §8 item 7).
  # To hand the job back to Actions, uncomment the schedule below and drop the
  # job from cellar/batch.py JOBS.
  # schedule:
  # - cron: "10 10 * * *"

concurrency:
  group: nhl-shots-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: kahla-scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: kahla-scanner/requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run ingest
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'delta' }}"
          echo "mode=$MODE"
          case "$MODE" in
            probe)    python -m scripts.ingest_nhl_shots --probe ;;
            backfill) python -m scripts.ingest_nhl_shots --backfill --commit ;;
            delta|*)  python -m scripts.ingest_nhl_shots --delta --commit ;;
          esac
