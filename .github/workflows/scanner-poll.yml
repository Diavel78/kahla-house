name: Odds Ingest — Poll (RETIRED)

# RETIRED Oct 6 2026 — a no-op kept only so cron-job.org's per-minute
# workflow_dispatch does not start erroring (delete the cron-job.org job and
# then this file). Everything it used to do runs on the house box:
#   - resolver grading + the ESPN markets spine  -> the `grader` lane
#   - the poly_activities mirror + dashboard cache -> the `mirror` lane
#   - the Pinnacle slate pulls                     -> the sheet batch jobs
# The per-minute Vercel pings it carried (pm-snapshot, paperlog) were the
# Pick Bot's feeds; the Pick Bot is dead, and with the box's paperlog lane
# retired a ping here would have handed those routes BACK to Vercel (lease
# arbitration) and woken the machine's engines in the paperlog route body.
# Full history: git log on this path.

on:
  workflow_dispatch:

concurrency:
  group: odds-ingest-poll
  cancel-in-progress: true

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - run: echo "retired Oct 6 2026 — the box runs everything (grader + mirror lanes); delete the cron-job.org job"
