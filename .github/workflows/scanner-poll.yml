name: Odds Ingest — Poll

# Kahla House odds ingest via The Odds API (v4).
#
# One API call per sport hits /v4/sports/{sport_key}/odds with
#   markets=h2h,spreads,totals
#   regions=us,eu          ← EU is required for Pinnacle (it's not in US region)
# Persists book_snapshots to Supabase, deduped: only writes when a
# (market, book, market_type, side)'s price/line changes.
#
# Cost math (The Odds API charges credits = markets × regions per call):
#   3 markets × 2 regions = 6 credits per call
#
# Adaptive cadence (per-sport gate in scrapers/odds_api.py:_should_fire):
#   nearest game in:
#     ≤ 30 min       → poll every 2 min   (terminal steam window)
#     30 min – 2h    → poll every 5 min   (final-2h sharp window)
#     2 – 6h         → poll every 15 min
#     6 – 18h        → poll every 30 min
#     18h+ / none    → skip (off-season / nothing meaningful pre-game)
#   overnight 10p-7a MT → skip regardless (no US games tip at 3am)
#   no event in next 7d → skip (off-season)
#
# cron-job.org should fire this workflow every 1 min so the per-sport
# gate can hit its 2-min bucket reliably. The gate writes a heartbeat
# row to odds_ingest_runs on every tick (fired OR skipped).
#
# Required GitHub repo secrets:
#   ODDS_API_KEY         — from the-odds-api.com (paid tier)
#   SUPABASE_URL
#   SUPABASE_SERVICE_KEY
#   TELEGRAM_BOT_TOKEN   — optional; from @BotFather. Sharp/steam alerts
#   TELEGRAM_CHAT_ID     — optional; user id from /getUpdates.
#                          Both required to send alerts; if either is
#                          missing the alert step exits as a no-op.
#   FILLS_CRON_SECRET    — optional; same value as the Vercel env var.
#                          Enables the redundant Polymarket fill-alert
#                          ping step below. If unset, that step no-ops.
#
# To add/remove sports: edit SPORTS_ENABLED below.

# Trigger: cron-job.org pings workflow_dispatch every 1 min so the
# adaptive cadence gate above can hit its 2-min bucket in the final
# 30 min pre-tip. Idle ticks are cheap — gate returns instantly with
# a heartbeat row. concurrency:cancel-in-progress: true ensures we
# never queue two overlapping runs.
on:
  workflow_dispatch:

concurrency:
  group: odds-ingest-poll
  # If cron-job.org ever retries or someone manually triggers while a run
  # is queued, cancel the older one. Each run is idempotent (dedup logic
  # in scrapers/odds_api.py) so a half-finished run getting killed loses
  # nothing — the next run picks up what was missed. This guarantees we
  # never run two ingests back-to-back and double the credit burn.
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: kahla-scanner

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: kahla-scanner/requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      # ESPN-spine: ESPN's free scoreboard creates the `markets` rows; runs
      # BEFORE odds_api so the rows exist when odds_api attaches snapshots.
      # Dedup fixed June 2026 (windows the candidate set to upcoming games,
      # not all-active — the prior all-active fetch got truncated at 1000 by
      # the never-cleaned table and minted a dupe every tick). Verified
      # idempotent: a commit run then a re-run shows 0 would-create.
      # WORLDCUP excluded (the tab sources ESPN+PMM directly). UFC = ESPN's
      # UFC-scoped mma/ufc (no GLORY kickboxing). continue-on-error so an
      # ESPN blip never blocks the odds tick.
      - name: ESPN → markets (schedule spine)
        continue-on-error: true
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m scripts.ingest_espn_markets --exclude WORLDCUP --commit

      # The Odds API / Pinnacle ingest was RETIRED June 2026 (hard cutover
      # to the free PMM+Kalshi exchanges — the subscription was paid through
      # June 25 but the pick engine, CLV, and fair anchor no longer depend on
      # PIN, so there was no reason to keep burning credits). The exchange
      # ingest is now the pm-snapshot ping in the `fill_ping` job below; ESPN
      # (above) owns market creation. `book_snapshots` simply stops getting
      # new rows — every PIN reader degrades to its exchange path or its warm
      # fallback. The adaptive-cadence gate + odds_pull_requests trigger in
      # scrapers/odds_api.py are now dead code (kept in git history); the
      # /odds Board rebuild on pm_snapshots is the remaining fast-follow.

      # Handicapper Bot — pick resolver. Grades pending bot_picks rows
      # (from in-chat pick logging via scripts/handicapper_log_pick.py)
      # against ESPN final scores. Same pattern as paper_bets_resolver,
      # but reads `units` per row (1/3/5u sizing instead of flat 1u).
      - name: Bot picks — Resolver
        continue-on-error: true
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m scripts.bot_picks_resolver

  # Polymarket Filled Bot — fill-alert ping. Redundant trigger for
  # /api/polymarket/check-fills, which is normally hit every minute by a
  # STANDALONE cron-job.org job that has silently auto-disabled itself more
  # than once (cron-job.org kills jobs after repeated failures), killing
  # fill alerts. Riding this already-alive workflow_dispatch trigger removes
  # that single point of failure — the endpoint is idempotent (milestone-
  # keyed dedup in polymarket_fill_state), so double-pinging is harmless.
  #
  # SEPARATE PARALLEL JOB on purpose: the `poll` job runs longer than the
  # 60s cron cadence on a busy slate, so concurrency:cancel-in-progress
  # guillotines it mid-run — a ping appended as poll's LAST step never
  # executed (the early odds-ingest heartbeat landed, the trailing ping did
  # not). As its own job it runs concurrently and finishes in ~10s, well
  # inside the cancellation window, so it actually fires every tick. No
  # checkout / Python needed — it's just a curl.
  fill_ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Polymarket — fill-alert ping
        continue-on-error: true
        env:
          FILLS_CRON_SECRET: ${{ secrets.FILLS_CRON_SECRET }}
        run: |
          if [ -z "$FILLS_CRON_SECRET" ]; then
            echo "FILLS_CRON_SECRET not set — skipping fill-alert ping (no-op)."
            exit 0
          fi
          # Strip ALL whitespace from the secret before building the URL —
          # GitHub secrets routinely carry a trailing newline from copy-paste,
          # and curl then rejects the URL with an embedded control char
          # ("curl (3): URL rejected: Malformed input"), so the request never
          # sends and the bot silently dies (HTTP 000, no Vercel log). Same
          # class of bug as the Telegram token (gotcha #22). Vercel's side
          # already .strip()s its env, so this makes the two keys match.
          # DO NOT remove this sanitize — it's the whole reason this works.
          KEY=$(printf '%s' "$FILLS_CRON_SECRET" | tr -d '[:space:]')
          code=$(curl -sS -m 25 -o /dev/null -w '%{http_code}' \
            "https://www.thekahlahouse.com/api/polymarket/check-fills?key=${KEY}" || echo "000")
          echo "check-fills HTTP $code"

      # Pick Bot prime-window alert ping. Same lightweight curl pattern —
      # /api/handicapper/prime-alert fires a batched Telegram (via the
      # Filled Bot) when a cluster of games enters the 90-120 min pre-tip
      # window, deduped server-side via the prime_alerts table. Reuses
      # FILLS_CRON_SECRET (the endpoint accepts it as a fallback), so no
      # new secret is needed. Idempotent — double-pinging is harmless.
      #
      # CADENCE GATE (June 2026): every 5 min, not every tick. Vercel
      # Fluid Active CPU is metered (the per-minute pings blew the Hobby
      # tier's 4h/mo); the alert's batching window is 30 min wide, so a
      # ≤4-min delivery delay is immaterial. Only check-fills keeps 1-min.
      - name: Pick Bot — prime-window alert ping
        continue-on-error: true
        env:
          FILLS_CRON_SECRET: ${{ secrets.FILLS_CRON_SECRET }}
        run: |
          M=$(date -u +%-M)
          if [ $(( M % 5 )) -ne 0 ]; then
            echo "minute $M — skipping prime-alert ping (5-min cadence)."
            exit 0
          fi
          if [ -z "$FILLS_CRON_SECRET" ]; then
            echo "FILLS_CRON_SECRET not set — skipping prime-window ping (no-op)."
            exit 0
          fi
          KEY=$(printf '%s' "$FILLS_CRON_SECRET" | tr -d '[:space:]')
          code=$(curl -sS -m 25 -o /dev/null -w '%{http_code}' \
            "https://www.thekahlahouse.com/api/handicapper/prime-alert?key=${KEY}" || echo "000")
          echo "prime-alert HTTP $code"

      # Prediction-market cent-logger ping. /api/pm-snapshot records free
      # Polymarket + Kalshi cents per side for upcoming MLB games into
      # pm_snapshots (deduped) — the cross-confirm detector's memory + the
      # data to validate the 1c-AND and measure the lead vs paid PINN. Free
      # (no Odds-API hit). Reuses FILLS_CRON_SECRET; idempotent.
      #
      # CADENCE GATE (June 2026): every 2 min (Vercel Active CPU burn —
      # this is ~7.5s of budgeted PMM lookups per tick). The free feeds
      # lead PINN by ~4-7 min, so 2-min sampling keeps most of the
      # cross-confirm trigger's latency edge at half the CPU.
      - name: Prediction-market — PMM+Kalshi cent snapshot ping
        continue-on-error: true
        env:
          FILLS_CRON_SECRET: ${{ secrets.FILLS_CRON_SECRET }}
        run: |
          M=$(date -u +%-M)
          if [ $(( M % 2 )) -ne 0 ]; then
            echo "minute $M — skipping pm-snapshot ping (2-min cadence)."
            exit 0
          fi
          if [ -z "$FILLS_CRON_SECRET" ]; then
            echo "FILLS_CRON_SECRET not set — skipping pm-snapshot ping (no-op)."
            exit 0
          fi
          KEY=$(printf '%s' "$FILLS_CRON_SECRET" | tr -d '[:space:]')
          code=$(curl -sS -m 25 -o /dev/null -w '%{http_code}' \
            "https://www.thekahlahouse.com/api/pm-snapshot?key=${KEY}" || echo "000")
          echo "pm-snapshot HTTP $code"

      # World Cup cent-logger ping. /api/pm-snapshot-wc records Polymarket
      # 1-X-2 (home/draw/away) cents for upcoming World Cup matches into
      # pm_snapshots — the 3-way exchange-history clock the soccer sharp score
      # reads. PMM-only (Kalshi has no WC series). Reuses FILLS_CRON_SECRET;
      # idempotent (dedup on cent change). Cheap (one cached PMM bulk call).
      #
      # CADENCE GATE: every 2 min on ODD minutes — offset from the pm-snapshot
      # ping above (even minutes) so the two don't stack Vercel Active CPU on
      # the same tick (gotcha #38).
      - name: World Cup — PMM 1-X-2 cent snapshot ping
        continue-on-error: true
        env:
          FILLS_CRON_SECRET: ${{ secrets.FILLS_CRON_SECRET }}
        run: |
          M=$(date -u +%-M)
          if [ $(( M % 2 )) -ne 1 ]; then
            echo "minute $M — skipping pm-snapshot-wc ping (2-min cadence, odd)."
            exit 0
          fi
          if [ -z "$FILLS_CRON_SECRET" ]; then
            echo "FILLS_CRON_SECRET not set — skipping pm-snapshot-wc ping (no-op)."
            exit 0
          fi
          KEY=$(printf '%s' "$FILLS_CRON_SECRET" | tr -d '[:space:]')
          code=$(curl -sS -m 25 -o /dev/null -w '%{http_code}' \
            "https://www.thekahlahouse.com/api/pm-snapshot-wc?key=${KEY}" || echo "000")
          echo "pm-snapshot-wc HTTP $code"

      # Pick Bot paperlog ping. /api/handicapper/paperlog auto-logs every
      # gate-cleared suggestion for upcoming MLB games (5h->1min window) into
      # pickbot_paperlog — the complete bot-suggestion dataset for the 2-week
      # review. Budgeted server-side so it stays under Vercel's 10s; stale-
      # game-first cycles coverage across ticks. Reuses FILLS_CRON_SECRET.
      #
      # CADENCE GATE (June 2026): every 5 min. This is the single biggest
      # Vercel Active CPU burner (~8s of build_dossier per tick, all day on
      # an MLB slate). The dedup is on bet CHANGE, so 5-min sampling loses
      # essentially nothing for the timing-window review dataset.
      - name: Pick Bot — paperlog ping
        continue-on-error: true
        env:
          FILLS_CRON_SECRET: ${{ secrets.FILLS_CRON_SECRET }}
        run: |
          M=$(date -u +%-M)
          if [ $(( M % 5 )) -ne 0 ]; then
            echo "minute $M — skipping paperlog ping (5-min cadence)."
            exit 0
          fi
          if [ -z "$FILLS_CRON_SECRET" ]; then
            echo "FILLS_CRON_SECRET not set — skipping paperlog ping (no-op)."
            exit 0
          fi
          KEY=$(printf '%s' "$FILLS_CRON_SECRET" | tr -d '[:space:]')
          code=$(curl -sS -m 25 -o /dev/null -w '%{http_code}' \
            "https://www.thekahlahouse.com/api/handicapper/paperlog?key=${KEY}" || echo "000")
          echo "paperlog HTTP $code"
