name: Crease IQ — Backtest

# Crease IQ Phase 2: walk-forward backtest of the goalie-aware NHL model
# over nhl_goalie_games. Manual dispatch only — metrics print to the run
# log (accuracy / Brier / calibration vs the dead 53.3% team core).
#
# Required repo secrets: SUPABASE_URL, SUPABASE_SERVICE_KEY.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "report | sweep"
        required: false
        default: "report"

concurrency:
  group: crease-iq-backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kahla-scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: kahla-scanner/requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run backtest
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'report' }}"
          if [ "$MODE" = "sweep" ]; then
            python -m scripts.backtest_crease_iq --sweep
          else
            python -m scripts.backtest_crease_iq
          fi
