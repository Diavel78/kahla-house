name: Savant xwOBA — Ingest

# Diamond IQ ITER4 (the Statcast spine): per-batter per-day xwOBA
# Probe verifies CSV columns AND Actions-IP tolerance first.
# aggregates from Baseball Savant into mlb_xwoba_batter_days.
# team-aggregate blob" gap while pitching is player-level.
#   probe    — reachability + boxscore shape verification, no writes.
#   backfill — 2025-03-01 → today (~40 min; ~20 batter rows/game).
#   delta    — last 4 days (the daily in-season default).
#
# Required repo secrets: SUPABASE_URL, SUPABASE_SERVICE_KEY.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe | backfill | backfill-platoon | delta"
        required: false
        default: "delta"
  # ── SCHEDULE DISABLED 2026-08-17 — THE CELLAR OWNS THIS JOB ──────────────
  # Runs from the house box instead (cellar/batch.py, `batch` lane). The
  # cellar_lease does NOT protect against GitHub Actions — Actions claims
  # nothing, it just fires — so leaving this cron on means the job runs twice
  # a day. Verified first: 12/12 jobs ran unattended from the cellar overnight.
  #
  # workflow_dispatch is deliberately KEPT: this workflow remains the standby
  # and stays runnable by hand. Disable, never delete (spec §8 item 7).
  # To hand the job back to Actions, uncomment the schedule below and drop the
  # job from cellar/batch.py JOBS.
  # schedule:
  # - cron: "45 10 * * *"

concurrency:
  group: savant-xwoba-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: kahla-scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: kahla-scanner/requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run ingest
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'delta' }}"
          echo "mode=$MODE"
          case "$MODE" in
            probe)    python -m scripts.ingest_savant_xwoba --probe ;;
            backfill) python -m scripts.ingest_savant_xwoba --backfill --commit ;;
            backfill-platoon)
                      python -m scripts.ingest_savant_xwoba --backfill --platoon --commit ;;
            delta|*)  python -m scripts.ingest_savant_xwoba --delta --platoon --commit ;;
          esac
