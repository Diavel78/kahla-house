name: site-curl
# Manual curl bridge: the Claude Code sandbox can't reach
# thekahlahouse.com (network allowlist), but this runner can — and it
# holds FILLS_CRON_SECRET, so it can hit the shared-secret cron/debug
# endpoints. Dispatch with a path; the response prints to the job log
# (and shared-secret endpoints persist their results to the DB anyway).
on:
  workflow_dispatch:
    inputs:
      path:
        description: "Site path to GET (no leading slash, no query). ?key= is appended."
        required: true
        type: string
      query:
        description: "Extra query params appended AFTER the key, e.g. 'dry=1&sport=mlb' (no leading &)."
        required: false
        type: string
      repeat:
        description: "Call the endpoint this many times, 6s apart (default 1). For endpoints that work a bounded batch per invocation."
        required: false
        type: string

jobs:
  curl:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: curl the endpoint
        env:
          # gotcha #22: GitHub secrets often carry trailing whitespace —
          # a raw ${{ secrets }} interpolation into the URL broke curl
          # with "Malformed input" on run #1. Strip via env var.
          CRON_KEY: ${{ secrets.FILLS_CRON_SECRET }}
        run: |
          KEY="$(printf '%s' "$CRON_KEY" | tr -d '[:space:]')"
          # Extra params must follow the key — putting them in `path`
          # makes them part of the PATH and 404s (run #4 learned this).
          Q="${{ inputs.query }}"
          [ -n "$Q" ] && Q="&${Q}"
          # Repeat drives endpoints that deliberately bound their own work
          # per invocation (e.g. /api/polymarket/topup, which refuses to
          # start a cancel→create it can't finish inside the function
          # budget). Each pass is its own short serverless call.
          N="${{ inputs.repeat }}"
          case "$N" in ''|*[!0-9]*) N=1 ;; esac
          [ "$N" -lt 1 ] && N=1
          [ "$N" -gt 40 ] && N=40
          for i in $(seq 1 "$N"); do
            [ "$N" -gt 1 ] && echo "=== pass $i/$N ==="
            curl -sSL --max-time 120 \
              "https://www.thekahlahouse.com/${{ inputs.path }}?key=${KEY}${Q}" \
              | head -c 60000
            echo
            [ "$i" -lt "$N" ] && sleep 6
          done
          exit 0
