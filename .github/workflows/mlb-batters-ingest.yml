name: MLB Batters — Ingest

# Diamond IQ Phase 3 (the BATTER spine): per-game batting logs (actual
# lineup slot via battingOrder + every batter's line) from the official
# MLB Stats API into mlb_batter_games — closes the "offense is a
# team-aggregate blob" gap while pitching is player-level.
#   probe    — reachability + boxscore shape verification, no writes.
#   backfill — 2025-03-01 → today (~40 min; ~20 batter rows/game).
#   delta    — last 4 days (the daily in-season default).
#
# Required repo secrets: SUPABASE_URL, SUPABASE_SERVICE_KEY.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe | backfill | delta"
        required: false
        default: "delta"
  schedule:
    - cron: "40 10 * * *"

concurrency:
  group: mlb-batters-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: kahla-scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: kahla-scanner/requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run ingest
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'delta' }}"
          echo "mode=$MODE"
          case "$MODE" in
            probe)    python -m scripts.ingest_mlb_batters --probe ;;
            backfill) python -m scripts.ingest_mlb_batters --backfill --commit ;;
            delta|*)  python -m scripts.ingest_mlb_batters --delta --commit ;;
          esac
