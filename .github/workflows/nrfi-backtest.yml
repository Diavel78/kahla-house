name: NRFI Model — Backtest

# Manually-triggered calibration backtest of the NRFI/YRFI first-inning
# model. Pulls completed MLB games (MLB Stats API — free, no secrets),
# reconstructs the model inputs, predicts P(NRFI), and grades vs the
# actual 1st-inning linescore. Prints base rate / model mean / Brier /
# accuracy / a calibration table to the run log — read it there.
#
# Use it to anchor NRFI_Q_BASE + tune NRFI_Q_SLOPE before trusting the
# card's lean. See scripts/nrfi_backtest.py for the leakage caveat (it's
# a calibration check, not a clean walk-forward edge proof). No writes,
# no schedule, no secrets.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Window in days ending yesterday"
        required: false
        default: "45"
      season:
        description: "Stats season (blank = current year)"
        required: false
        default: ""

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kahla-scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: kahla-scanner/requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run NRFI backtest
        run: |
          ARGS="--days ${{ github.event.inputs.days || '45' }}"
          if [ -n "${{ github.event.inputs.season }}" ]; then ARGS="$ARGS --season ${{ github.event.inputs.season }}"; fi
          python -m scripts.nrfi_backtest $ARGS
