name: Football Sheets — Data Assembly

# FOOTBALL WEEKLY GAME SHEETS (docs/football-sheet-runbook.md).
# Assembles the mechanical data_blob per game (full FBS + NFL week: model
# pricing, exchange tape, VSiN splits, ESPN injuries/FPI/AP ranks, history)
# into the football_sheets table. Runs HERE because the Actions runner is
# the only compute that reaches BOTH ESPN and Supabase — the CCR generation
# sandbox is ESPN-blocked, the cellar stays a betting machine.
#
# Schedule (UTC — AZ is UTC-7 year-round):
#   Tue 00:00 UTC = Monday 5:00 pm AZ  → monday mode (full build, new
#     narrative). The Monday generation Routine fires 6:30 pm AZ and reads
#     these blobs.
#   Every ~6h Thu 5am AZ → Mon 5am AZ → friday mode (RE-PRICE ONLY: fresh
#     market lines + model, no new narrative). Added Sep 20 2026 (Rob:
#     "the NFL lines are stagnant... I thought we said every 6 hours?") —
#     the 6-hour cadence the /football-picks PAGE polls at only re-fetches
#     whatever's already in the DB; NOTHING was recomputing the DATA
#     between Monday's build and Friday's single diff, so a Sunday slate's
#     lines were up to 2 days stale. `--mode friday` is really "refresh":
#     it rebuilds data_blob.friday.{lines,model,...} for every game not yet
#     kicked off and always diffs against MONDAY's baseline (never the
#     previous refresh — friday_diff reads the blob's top-level fields,
#     which only the monday build writes), so running it many times a
#     week is safe and idempotent-ish. The Friday 5am AZ run is special
#     only in that the 6am AZ narrative Routine reads its `changes` output
#     to write friday_md blurbs — every OTHER friday-mode fire this
#     schedule adds is silent re-pricing, no narrative, no PDF re-render.
#     (Separate "slate" text-card Routines that used to run Thu/Fri/Sat on
#     overlapping schedules were retired Sep 18 2026 — this is the one
#     football-sheets pipeline now.)
# In-season only in effect: outside the season the script finds no games
# and exits quietly (monday mode exits 1 on a truly empty slate so a dark
# spine shows red — the six-day-green lesson).
#
# Required repo secrets: SUPABASE_URL, SUPABASE_SERVICE_KEY.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "monday (full build) or friday (re-price/refresh only)"
        required: false
        default: "monday"
      week_key:
        description: "Week key YYYY-MM-DD (default: this week's Monday, AZ)"
        required: false
        default: ""
      sport:
        description: "Limit to one sport (NFL or NCAAF)"
        required: false
        default: ""
      days:
        description: "Lookahead window in days"
        required: false
        default: "8"
  schedule:
    - cron: "0 0 * * 2"    # Tue 00:00 UTC = Mon 5pm AZ  — monday full build
    - cron: "0 12 * * 4"   # Thu 12:00 UTC = Thu 5am AZ  — refresh
    - cron: "0 18 * * 4"   # Thu 18:00 UTC = Thu 11am AZ — refresh
    - cron: "0 12 * * 5"   # Fri 12:00 UTC = Fri 5am AZ  — refresh (feeds the 6am narrative Routine)
    - cron: "0 18 * * 5"   # Fri 18:00 UTC = Fri 11am AZ — refresh
    - cron: "0 12 * * 6"   # Sat 12:00 UTC = Sat 5am AZ  — refresh (before CFB slate)
    - cron: "0 18 * * 6"   # Sat 18:00 UTC = Sat 11am AZ — refresh
    - cron: "0 12 * * 0"   # Sun 12:00 UTC = Sun 5am AZ  — refresh (before NFL slate)
    - cron: "0 17 * * 0"   # Sun 17:00 UTC = Sun 10am AZ — refresh (before early NFL kickoffs)
    - cron: "0 22 * * 0"   # Sun 22:00 UTC = Sun 3pm AZ  — refresh (before SNF)
    - cron: "0 12 * * 1"   # Mon 12:00 UTC = Mon 5am AZ  — refresh (before MNF)

concurrency:
  group: football-sheets-data
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kahla-scanner

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: kahla-scanner/requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Resolve mode
        id: mode
        run: |
          # Only the Tue-00:00-UTC cron is the full "monday" build; every
          # other scheduled cron in this file is a "friday" (refresh-only)
          # fire — matched by the exact cron string GitHub hands us in
          # github.event.schedule, not by guessing from the day-of-week
          # (that broke the moment a second schedule entry landed on the
          # same day). workflow_dispatch takes the input.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode || 'monday' }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 0 * * 2" ]; then
            echo "mode=monday" >> "$GITHUB_OUTPUT"
          else
            echo "mode=friday" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble sheet data
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: >
          python -m scripts.football_sheet_data
          --mode ${{ steps.mode.outputs.mode }}
          --days ${{ github.event.inputs.days || '8' }}
          --commit
          ${{ github.event.inputs.week_key && format('--week-key {0}', github.event.inputs.week_key) || '' }}
          ${{ github.event.inputs.sport && format('--sport {0}', github.event.inputs.sport) || '' }}

      - name: Sync to production DB (the site reads a DIFFERENT database now)
        # Vercel's SUPABASE_URL moved to db.thekahlahouse.com (the box) at
        # the Cellar cutover; this workflow still writes the ORIGINAL cloud
        # project. Without this step the assembly succeeds but the site
        # never sees it — exactly what happened Sep 4-19 2026 with nobody
        # noticing until /football-picks shipped and showed 3-week-old
        # games. continue-on-error: the assembly itself already committed;
        # a sync failure here should not fail the whole run, just get
        # caught by whoever reads the job log.
        continue-on-error: true
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FILLS_CRON_SECRET:    ${{ secrets.FILLS_CRON_SECRET }}
        run: |
          SPORT="${{ github.event.inputs.sport }}"
          if [ -n "$SPORT" ]; then
            python -m scripts.football_sheet_sync --sport "$SPORT" --latest
          else
            python -m scripts.football_sheet_sync --sport NFL --sport NCAAF --latest
          fi
