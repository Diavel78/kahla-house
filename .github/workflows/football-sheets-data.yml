name: Football Sheets — Data Assembly

# FOOTBALL WEEKLY GAME SHEETS (docs/football-sheet-runbook.md).
# Assembles the mechanical data_blob per game (full FBS + NFL week: model
# pricing, exchange tape, VSiN splits, ESPN injuries/FPI/AP ranks, history)
# into the football_sheets table. Runs HERE because the Actions runner is
# the only compute that reaches BOTH ESPN and Supabase — the CCR generation
# sandbox is ESPN-blocked, the cellar stays a betting machine.
#
# Schedule (UTC — AZ is UTC-7 year-round):
#   Tue 00:00 UTC = Monday 5:00 pm AZ  → monday mode (full build). The
#     Monday generation Routine fires 6:30 pm AZ and reads these blobs.
#   Fri 12:00 UTC = Friday 5:00 am AZ  → friday mode (diff vs Monday). MOVED
#     HERE Sep 18 2026 (was 2pm AZ) so the whole pipeline lands before Rob
#     wakes up — the Friday narrative Routine now fires 6:00 am AZ and
#     publishes both the full pack and the picks-only sheet by ~6:15 am.
#     (Separate "slate" text-card Routines that used to run Thu/Fri/Sat on
#     overlapping schedules were retired the same day — this is the one
#     football-sheets pipeline now.)
# In-season only in effect: outside the season the script finds no games
# and exits quietly (monday mode exits 1 on a truly empty slate so a dark
# spine shows red — the six-day-green lesson).
#
# Required repo secrets: SUPABASE_URL, SUPABASE_SERVICE_KEY.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "monday (full build) or friday (diff vs Monday)"
        required: false
        default: "monday"
      week_key:
        description: "Week key YYYY-MM-DD (default: this week's Monday, AZ)"
        required: false
        default: ""
      sport:
        description: "Limit to one sport (NFL or NCAAF)"
        required: false
        default: ""
      days:
        description: "Lookahead window in days"
        required: false
        default: "8"
  schedule:
    - cron: "0 0 * * 2"    # Mon 5pm AZ — monday build
    - cron: "0 12 * * 5"   # Fri 5am AZ — friday diff (moved from 2pm)

concurrency:
  group: football-sheets-data
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kahla-scanner

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: kahla-scanner/requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Resolve mode
        id: mode
        run: |
          # Scheduled fires pick mode by day-of-week (Tue UTC = monday build,
          # Fri UTC = friday diff); dispatch takes the input.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode || 'monday' }}" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%u)" = "5" ]; then
            echo "mode=friday" >> "$GITHUB_OUTPUT"
          else
            echo "mode=monday" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble sheet data
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: >
          python -m scripts.football_sheet_data
          --mode ${{ steps.mode.outputs.mode }}
          --days ${{ github.event.inputs.days || '8' }}
          --commit
          ${{ github.event.inputs.week_key && format('--week-key {0}', github.event.inputs.week_key) || '' }}
          ${{ github.event.inputs.sport && format('--sport {0}', github.event.inputs.sport) || '' }}

      - name: Sync to production DB (the site reads a DIFFERENT database now)
        # Vercel's SUPABASE_URL moved to db.thekahlahouse.com (the box) at
        # the Cellar cutover; this workflow still writes the ORIGINAL cloud
        # project. Without this step the assembly succeeds but the site
        # never sees it — exactly what happened Sep 4-19 2026 with nobody
        # noticing until /football-picks shipped and showed 3-week-old
        # games. continue-on-error: the assembly itself already committed;
        # a sync failure here should not fail the whole run, just get
        # caught by whoever reads the job log.
        continue-on-error: true
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FILLS_CRON_SECRET:    ${{ secrets.FILLS_CRON_SECRET }}
        run: |
          SPORT="${{ github.event.inputs.sport }}"
          if [ -n "$SPORT" ]; then
            python -m scripts.football_sheet_sync --sport "$SPORT" --latest
          else
            python -m scripts.football_sheet_sync --sport NFL --sport NCAAF --latest
          fi
