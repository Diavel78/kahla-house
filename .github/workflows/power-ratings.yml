name: Power Ratings — Ingest + Compute

# Builds the bot's independent power ratings:
#   1. ingest_results.py — pull completed game final scores from ESPN
#      into the game_results table.
#   2. compute_power_ratings.py — solve opponent-adjusted off/def ratings
#      per sport and write a power_ratings snapshot Flask reads.
#
# Runs once daily (finals don't change, and ratings shift slowly). The
# scheduled run scans the last couple days; to BACKFILL a season, trigger
# manually (Actions tab → Run workflow) with `days` set high, e.g. 200.
#
# Required repo secrets: SUPABASE_URL, SUPABASE_SERVICE_KEY.
# Free — ESPN scoreboard is public, no Odds API credits touched.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days of finals to ingest (use ~200 for a season backfill)"
        required: false
        default: "2"
      sport:
        description: "Limit ingest to one sport (e.g. NFL) — a multi-season backfill across all six sports would blow the timeout"
        required: false
        default: ""
  # ── SCHEDULE DISABLED 2026-08-17 — THE CELLAR OWNS THIS JOB ──────────────
  # Runs from the house box instead (cellar/batch.py, `batch` lane). The
  # cellar_lease does NOT protect against GitHub Actions — Actions claims
  # nothing, it just fires — so leaving this cron on means the job runs twice
  # a day. Verified first: 12/12 jobs ran unattended from the cellar overnight.
  #
  # workflow_dispatch is deliberately KEPT: this workflow remains the standby
  # and stays runnable by hand. Disable, never delete (spec §8 item 7).
  # To hand the job back to Actions, uncomment the schedule below and drop the
  # job from cellar/batch.py JOBS.
  # schedule:
  # # 11:00 UTC ≈ 4am MT — after the latest US games have gone final.
  # - cron: "0 11 * * *"

concurrency:
  group: power-ratings
  cancel-in-progress: true

jobs:
  rate:
    runs-on: ubuntu-latest
    # 30 min: a season backfill (days≈330) makes ~2000 sequential ESPN
    # scoreboard calls and can pass 10 min. The daily days=2 run stays <1 min.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: kahla-scanner

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: kahla-scanner/requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Ingest ESPN finals
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: >
          python -m scripts.ingest_results
          --days ${{ github.event.inputs.days || '2' }}
          ${{ github.event.inputs.sport && format('--sport {0}', github.event.inputs.sport) || '' }}

      - name: Compute power ratings
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m scripts.compute_power_ratings
