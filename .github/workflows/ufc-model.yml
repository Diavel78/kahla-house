name: UFC Model — Compute + Backtest

# Fight IQ Phase 2: the FightElo engine over the ufc_fights spine.
#   compute  — full replay + calibration fit, writes one ufc_model
#              snapshot row (what Flask reads in Phase 3). Weekly, Monday
#              11:00 UTC — an hour after the stats delta lands.
#   backtest — walk-forward evidence gate; metrics print to the run log.
# Pure Python over Supabase — no scraping, no Playwright here.
#
# Required repo secrets: SUPABASE_URL, SUPABASE_SERVICE_KEY.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "compute | backtest"
        required: false
        default: "backtest"
      eval_since:
        description: "backtest eval window start (YYYY-MM-DD)"
        required: false
        default: "2022-01-01"
  # ── SCHEDULE DISABLED 2026-08-17 — THE CELLAR OWNS THIS JOB ──────────────
  # Runs from the house box instead (cellar/batch.py, `batch` lane). The
  # cellar_lease does NOT protect against GitHub Actions — Actions claims
  # nothing, it just fires — so leaving this cron on means the job runs twice
  # a day. Verified first: 12/12 jobs ran unattended from the cellar overnight.
  #
  # workflow_dispatch is deliberately KEPT: this workflow remains the standby
  # and stays runnable by hand. Disable, never delete (spec §8 item 7).
  # To hand the job back to Actions, uncomment the schedule below and drop the
  # job from cellar/batch.py JOBS.
  # schedule:
  # - cron: "0 11 * * 1"

concurrency:
  group: ufc-model
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kahla-scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: kahla-scanner/requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'compute' }}"
          echo "mode=$MODE"
          if [ "$MODE" = "backtest" ]; then
            python -m scripts.backtest_ufc_model --eval-since "${{ github.event.inputs.eval_since || '2022-01-01' }}"
          else
            python -m scripts.compute_ufc_model --commit
            # Grade last card's duration-family paperlog shadows from the
            # freshly-ingested ufc_fights (the per-minute resolver only
            # grades UFC moneylines).
            python -m scripts.grade_ufc_paperlog --commit
          fi
