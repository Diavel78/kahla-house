name: ProphetX — Probe

# Read-only recon: is ProphetX's odds data reachable programmatically
# (documented API or the web app's own JSON endpoints)? Dispatch-only;
# results print to the run log. No secrets, no writes.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Optional: fetch ONE url and print it whole"
        required: false
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: kahla-scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install httpx
        run: pip install httpx
      - name: Run probe
        run: |
          URL="${{ github.event.inputs.url }}"
          if [ -n "$URL" ]; then
            python -m scripts.probe_prophetx --url "$URL"
          else
            python -m scripts.probe_prophetx
          fi
