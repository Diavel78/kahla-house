name: Diamond IQ Totals — Backtest

# O/U rebuild eval (the old totals model was blacklisted July 4 2026):
# runs calibration over the pitcher spine + market eval vs exchange ATM
# totals, with the line-anchored shrinkage read. Dispatch-only.

on:
  workflow_dispatch:

concurrency:
  group: diamond-totals-backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kahla-scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: kahla-scanner/requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run backtest
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m scripts.backtest_diamond_totals
