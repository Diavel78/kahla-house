name: Diamond IQ — Live Snapshot

# Serialize the walk-forward Diamond IQ state to diamond_iq_snapshot so
# Flask can price MLB moneylines from the model (the opener auto-bet
# lane). Daily after the pitcher-ingest delta, plus manual dispatch.
# Required repo secrets: SUPABASE_URL, SUPABASE_SERVICE_KEY.

on:
  workflow_dispatch:
  schedule:
    - cron: "50 10 * * *"

concurrency:
  group: diamond-iq-compute
  cancel-in-progress: false

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kahla-scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: kahla-scanner/requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Compute snapshot
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m scripts.compute_diamond_iq
