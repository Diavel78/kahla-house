<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahla House — Dashboard</title>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dashboard">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script>
        const FC = {
            apiKey: "AIzaSyDQbjlc7VIYmFjbhq119Cl1-JhuXwKq0fY",
            authDomain: "kahla-house.firebaseapp.com",
            projectId: "kahla-house",
            storageBucket: "kahla-house.firebasestorage.app",
            messagingSenderId: "1029771942929",
            appId: "1:1029771942929:web:76358096dbb868e375a5b0"
        };
        firebase.initializeApp(FC);
    </script>

    <style>
        :root {
            --bg: #0b0e13;
            --surface: #13171e;
            --line: #232a37;
            --text: #e8edf5;
            --muted: #7d8799;
            --green: #34d399;
            --red: #f87171;
            --cyan: #22d3ee;
        }
        * { box-sizing: border-box; }
        html, body { overflow-x: hidden; }
        body {
            margin: 0; background: var(--bg); color: var(--text);
            font-family: 'DM Sans', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line);
        }
        .nav { display: flex; gap: 16px; flex-wrap: wrap; }
        .nav a {
            color: var(--muted); text-decoration: none; font-size: 14px;
            font-weight: 500;
        }
        .nav a:hover, .nav a.on { color: var(--text); }
        .logout {
            background: none; border: 1px solid var(--line); color: var(--muted);
            border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer;
            font-family: inherit;
        }
        .wrap { max-width: 720px; margin: 0 auto; padding: 28px 18px 60px; }
        .grid {
            display: grid; gap: 14px;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .card {
            background: var(--surface); border: 1px solid var(--line);
            border-radius: 16px; padding: 20px 18px;
        }
        .card.wide { grid-column: 1 / -1; }
        .label {
            font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
            color: var(--muted); font-weight: 600; margin-bottom: 10px;
        }
        .value {
            font-family: 'JetBrains Mono', monospace; font-weight: 700;
            font-size: 30px; line-height: 1.1; letter-spacing: -0.02em;
        }
        .card.wide .value { font-size: 40px; }
        .pos { color: var(--green); }
        .neg { color: var(--red); }
        .sub { margin-top: 8px; font-size: 13px; color: var(--muted); }
        .foot {
            margin-top: 22px; display: flex; justify-content: space-between;
            align-items: center; gap: 10px; font-size: 12px; color: var(--muted);
        }
        .foot a { color: var(--muted); }
        .skel { color: var(--muted); }
        @media (max-width: 520px) {
            .value { font-size: 26px; }
            .card.wide .value { font-size: 34px; }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="nav">
            <a href="/">Home</a>
            <a href="/dashboard" class="on">Dashboard</a>
            <a href="/handicapper">Pick Bot</a>
        </div>
        <button class="logout" onclick="doLogout()">Log out</button>
    </div>

    <div class="wrap">
        <div class="grid">
            <div class="card wide">
                <div class="label">Lifetime earnings</div>
                <div class="value skel" id="vTotal">—</div>
                <div class="sub" id="subTotal">realized + open + maker rewards</div>
            </div>
            <div class="card">
                <div class="label">Today</div>
                <div class="value skel" id="vToday">—</div>
            </div>
            <div class="card">
                <div class="label">Yesterday</div>
                <div class="value skel" id="vYest">—</div>
            </div>
            <div class="card wide">
                <div class="label">Maker rewards — lifetime</div>
                <div class="value skel" id="vMaker">—</div>
                <div class="sub" id="subMaker">liquidity reward payouts</div>
            </div>
        </div>

        <div class="foot">
            <span id="stamp">loading…</span>
            <a href="/dashboard-full">Full dashboard →</a>
        </div>
    </div>

<script>
    async function authFetch(url, options = {}) {
        const user = firebase.auth().currentUser;
        if (!user) { window.location.href = '/'; return null; }
        const token = await user.getIdToken();
        const headers = { ...(options.headers || {}), 'Authorization': 'Bearer ' + token };
        return fetch(url, { ...options, headers });
    }

    function doLogout() {
        firebase.auth().signOut().then(() => { window.location.href = '/'; });
    }

    function money(v) {
        if (v === null || v === undefined || isNaN(v)) return '—';
        const s = v < 0 ? '-' : '+';
        return s + '$' + Math.abs(v).toFixed(2);
    }

    function paint(el, v, signed) {
        const n = document.getElementById(el);
        n.classList.remove('skel', 'pos', 'neg');
        if (v === null || v === undefined || isNaN(v)) { n.textContent = '—'; return; }
        n.textContent = signed ? money(v) : '$' + Number(v).toFixed(2);
        if (signed) n.classList.add(v >= 0 ? 'pos' : 'neg');
    }

    async function load() {
        // Never sit silently on "loading…" — a slow or dead upstream has
        // to say so. The activities walk can take tens of seconds on a
        // cold container, and an unbounded await just looks broken.
        const ctl = new AbortController();
        const kill = setTimeout(() => ctl.abort(), 45000);
        try {
            const tz = -new Date().getTimezoneOffset();
            const r = await authFetch('/api/data?slim=1&tz=' + tz,
                                      { signal: ctl.signal });
            if (!r) return;
            const j = await r.json();
            if (!j.ok) { document.getElementById('stamp').textContent = 'error'; return; }
            const s = j.summary || {};
            paint('vTotal', s.total_pnl, true);
            paint('vToday', s.today_pnl, true);
            paint('vYest', s.yesterday_pnl, true);
            paint('vMaker', s.maker_rewards, false);
            const bal = (j.balances || {}).current_balance;
            document.getElementById('subTotal').textContent =
                'realized + open + maker rewards' +
                (bal != null ? ' · balance $' + Number(bal).toFixed(2) : '') +
                (s.open_positions != null ? ' · ' + s.open_positions + ' open' : '');
            document.getElementById('stamp').textContent =
                'updated ' + new Date().toLocaleTimeString();
        } catch (e) {
            document.getElementById('stamp').textContent =
                (e && e.name === 'AbortError')
                    ? 'timed out — retrying' : 'error — retrying';
        } finally {
            clearTimeout(kill);
        }
    }

    firebase.auth().onAuthStateChanged(async user => {
        if (!user) { window.location.href = '/'; return; }
        const r = await authFetch('/api/me');
        const me = r ? await r.json() : null;
        if (!me || !me.ok || me.role !== 'admin') { window.location.href = '/'; return; }
        load();
        setInterval(load, 60000);
    });
</script>
</body>
</html>
