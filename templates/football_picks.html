<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahla House — Pick Sheets</title>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pick Sheets">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script>
        const FC = {
            apiKey: "AIzaSyDQbjlc7VIYmFjbhq119Cl1-JhuXwKq0fY",
            authDomain: "kahla-house.firebaseapp.com",
            projectId: "kahla-house",
            storageBucket: "kahla-house.firebasestorage.app",
            messagingSenderId: "1029771942929",
            appId: "1:1029771942929:web:76358096dbb868e375a5b0"
        };
        firebase.initializeApp(FC);
    </script>


    <style>
        /* THE REDESIGN (Oct 11 2026, Rob: "very functional… not very pretty
           or easy to look at"): five parts in order — money, missed, live,
           the sheet. COLOR ONLY MEANS MONEY: amber = resting, green =
           filled, red = needs you. Verdict pills are neutral. One button
           per market, on the model's side ("if I want to go against you…
           I can do it in the app"). 16px body, lifted greys. */
        :root {
            --bg: #0D1016; --card: #161B24; --card2: #1C2230; --line: #2A3242; --line2: #3A4354;
            --text: #F3F5F9; --text2: #C3CAD6; --text3: #98A2B3; --muted: #98A2B3;
            --blue: #4FB3FF;
            --g-bg: #123B28; --g-bd: #2E9E62; --g-tx: #7BE3A6;
            --a-bg: #3B3010; --a-bd: #C99A1E; --a-bd2: #6B5416; --a-tx: #FCD66A;
            --r-bg: #3E1818; --r-bd: #E05555; --r-bd2: #5A2626; --r-tx: #FFAAAA;
            --green: #7BE3A6; --red: #FFAAAA; --amber: #FCD66A; --cyan: #4FB3FF;
            --mono: 'JetBrains Mono', ui-monospace, monospace;
        }
        * { box-sizing: border-box; }
        html, body { overflow-x: hidden; }
        body {
            margin: 0; background: var(--bg); color: var(--text);
            font-family: 'DM Sans', system-ui, sans-serif; font-size: 16px; line-height: 1.4;
            -webkit-font-smoothing: antialiased;
        }
        button { font-family: inherit; }
        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap;
        }
        .nav { display: flex; gap: 18px; flex-wrap: wrap; }
        .nav a { color: var(--text2); text-decoration: none; font-size: 15px; font-weight: 500; }
        .nav a:hover, .nav a.on { color: var(--text); }
        .logout {
            background: none; border: 1px solid var(--line); color: var(--text2);
            border-radius: 10px; padding: 8px 14px; font-size: 14px; cursor: pointer;
        }
        .wrap { max-width: 720px; margin: 0 auto; padding: 16px 16px 60px; }

        /* header */
        .hd { display: flex; flex-direction: column; gap: 4px; margin: 4px 0 14px; }
        .hd1 { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
        h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.3px; }
        .hd-date { font-size: 14px; color: var(--text2); }
        .runinfo { font-size: 14px; color: var(--text2); }
        .runinfo b { color: var(--text); font-weight: 600; }

        /* money strip */
        .money { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
        .tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px;
                display: flex; flex-direction: column; gap: 2px; min-width: 0; }
        .tile .k { font-size: 13px; color: var(--text2); }
        .tile .v { font-family: var(--mono); font-size: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tile .s { font-size: 12px; color: var(--text3); }
        .pos { color: var(--g-tx); } .neg { color: var(--r-tx); }
        .alerts { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
        .alerts:empty { display: none; }
        .alert { background: var(--r-bg); border: 1px solid var(--r-bd); color: var(--r-tx); border-radius: 12px;
                 padding: 10px 12px; font-size: 14px; font-weight: 600; }
        .alert.amb { background: var(--a-bg); border-color: var(--a-bd2); color: var(--a-tx); }

        /* sections (missed, live) */
        .sec { margin-top: 22px; }
        .sec.hide { display: none; }
        .sh { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; cursor: pointer; user-select: none; }
        .sh h2 { margin: 0; font-size: 18px; font-weight: 700; }
        .sh .sub { font-size: 14px; color: var(--text2); margin-left: auto; text-align: right; }
        .sh .chev { color: var(--text3); font-size: 12px; transition: transform .15s; }
        .sec.collapsed .sh .chev { transform: rotate(-90deg); }
        .sec.collapsed .sb-body { display: none; }
        .sb-body { display: flex; flex-direction: column; gap: 10px; }
        .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px;
                display: flex; flex-direction: column; gap: 6px; }
        .card.miss { border-color: var(--r-bd2); }
        .card.miss.rest { border-color: var(--a-bd2); }
        .tag { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .4px; border-radius: 6px; padding: 3px 8px; }
        .tag.red { background: var(--r-bg); color: var(--r-tx); }
        .tag.amb { background: var(--a-bg); color: var(--a-tx); }
        .tag.grn { background: var(--g-bg); color: var(--g-tx); }
        .tag.gry { background: var(--card2); color: var(--text2); }
        .c-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .c-top .tags { display: flex; gap: 6px; flex-wrap: wrap; }
        .hidebtn { background: none; border: none; color: var(--text3); font-size: 15px; min-width: 44px; height: 32px; cursor: pointer; }
        .c-t { font-size: 17px; font-weight: 700; }
        .c-t .g { font-weight: 500; color: var(--text2); }
        .c-d { font-size: 15px; color: var(--text2); }
        .c-d b { color: var(--text); }
        .c-n { font-size: 14px; color: var(--text3); }
        .c-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
        .amt { font-family: var(--mono); font-size: 17px; font-weight: 600; white-space: nowrap; }
        .bar { display: flex; align-items: center; gap: 10px; }
        .bar .tr { flex: 1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
        .bar .fl { height: 8px; background: var(--g-bd); }
        .bar .fl.mid { background: var(--a-bd); }
        .bar .fl.lo { background: var(--r-bd); }
        .bar .p { font-family: var(--mono); font-size: 14px; min-width: 46px; text-align: right; }

        /* sheet controls */
        /* sport tabs: one row, the league's logo over its name (Rob, Oct 17 2026:
           "Blob is ugly… logo's??"). Logos come from /league-logo/<code>.png;
           a logo that fails to load leaves just the name. */
        .seg { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-top: 26px; }
        .tab { height: 48px; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
               gap: 5px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--text3);
               font-size: 12px; font-weight: 600; cursor: pointer; transition: border-color .15s, background .15s; }
        .tab .lg { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; }
        .tab .lg img { max-width: 30px; max-height: 30px; object-fit: contain; opacity: .5; filter: grayscale(.7);
                       transition: opacity .15s, filter .15s; }
        .tab .lg.nolg { display: none; }
        .tab .tl { display: none; }                      /* one line: the logo IS the tab (Rob: "don't need 2 lines") */
        .tab .lg.nolg + .tl { display: block; font-size: 13px; }   /* no logo → the name stands in */
        .tab.on { border-color: var(--text2); background: var(--card2); color: var(--text); font-weight: 700; }
        .tab.on .lg img { opacity: 1; filter: none; }
        .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
        .fchip { height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid var(--line); background: transparent;
                 color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer; }
        .fchip.on { background: var(--text); border-color: var(--text); color: var(--bg); }
        .search {
            width: 100%; margin: 12px 0 0; background: var(--card); border: 1px solid var(--line); color: var(--text);
            border-radius: 12px; padding: 12px 14px; font-size: 16px; font-family: inherit; -webkit-appearance: none;
        }
        .search:focus { outline: none; border-color: var(--blue); }
        .search::placeholder { color: var(--text3); }
        .meta { color: var(--text2); font-size: 14px; margin: 12px 0 4px; }
        .meta b { color: var(--text); }
        .day-hdr { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--text3); margin: 22px 0 8px; }

        /* game cards */
        .gc { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px;
              display: flex; flex-direction: column; gap: 14px; margin-bottom: 12px; }
        .gc.done { opacity: .8; }
        .gh { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
        .gh .gt { font-size: 13px; color: var(--text3); }
        .gh .gm { font-size: 19px; font-weight: 700; }
        .gh .gm .tv { font-size: 12px; font-weight: 600; color: var(--text3); border: 1px solid var(--line2); border-radius: 5px; padding: 1px 6px; margin-left: 8px; vertical-align: 3px; white-space: nowrap; }
        .gh .gs { font-size: 13px; color: var(--text2); text-align: right; }
        .gh .gs.warn { color: var(--r-tx); font-weight: 700; }
        .gsub { font-size: 14px; color: var(--text2); margin-top: -8px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .final { display: inline-block; color: var(--text); font-weight: 600; font-size: 13px; background: var(--card2);
                 border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; }
        .mk { display: flex; flex-direction: column; gap: 8px; }
        .mk-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .mk-l { font-size: 13px; font-weight: 700; color: var(--text3); letter-spacing: .6px; min-width: 54px; text-transform: uppercase; }
        .pill { font-size: 12px; font-weight: 700; border-radius: 6px; padding: 2px 8px; letter-spacing: .3px; }
        .pill.play { background: #8EE4AF; color: #0D1016; }
        .pill.lean { background: #FCE38A; color: #0D1016; }
        .pill.pass { border: 1px solid var(--line2); color: var(--text3); padding: 1px 7px; }
        .mk-m { font-size: 15px; color: var(--text2); }
        .mk-m .dim { color: var(--text3); }
        .mk.pass .mk-m { color: var(--text3); }
        .mk-x { font-size: 16px; font-family: var(--mono); font-weight: 600; }
        .unrated { color: var(--text3); font-style: italic; }
        .gr { margin-left: 4px; font-family: 'DM Sans', system-ui, sans-serif; }
        .bb { min-height: 56px; width: 100%; border-radius: 12px; border: 1px solid var(--line); background: var(--card2);
              color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center;
              gap: 2px; padding: 6px 10px; cursor: pointer; }
        .bb .bl { font-family: var(--mono); font-size: 17px; font-weight: 600; color: var(--text); }
        .bb .bs { font-size: 12px; font-weight: 700; }
        .bb.pass { min-height: 48px; background: transparent; border-style: dashed; border-color: var(--line2); }
        .bb.pass .bl { font-size: 16px; color: var(--text2); }
        .bb.in { border: 2px solid var(--blue); border-style: solid; }
        .bb.in .bs { color: var(--blue); }
        .bb.st-rest { background: var(--a-bg); border: 2px solid var(--a-bd); color: var(--a-tx); }
        .bb.st-fill { background: var(--g-bg); border: 2px solid var(--g-bd); color: var(--g-tx); }
        .bb.st-warn { background: var(--r-bg); border: 2px solid var(--r-bd); color: var(--r-tx); }
        .xb { border-radius: 12px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; cursor: pointer;
              border: 1px solid var(--line); background: var(--card2); }
        .xb.st-rest { background: var(--a-bg); border-color: var(--a-bd2); }
        .xb.st-fill { background: var(--g-bg); border-color: var(--g-bd); }
        .xb.st-warn { background: var(--r-bg); border-color: var(--r-bd); }
        .xb .xt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
        .xb .xl { font-size: 16px; font-weight: 700; }
        .xb .xs { font-size: 12px; font-weight: 700; margin-left: 6px; }
        .xb.st-rest .xs { color: var(--a-tx); } .xb.st-fill .xs { color: var(--g-tx); } .xb.st-warn .xs { color: var(--r-tx); }
        .xb .xd { font-size: 14px; color: var(--text2); }
        .xb .go { color: var(--text3); font-size: 22px; }
        .lostbox { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
        .empty { color: var(--text2); padding: 28px 0; text-align: center; font-size: 15px; }
        .hint { color: var(--text3); font-size: 14px; margin-top: 20px; text-align: center; }

        .live-flag { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .4px; padding: 3px 8px; border-radius: 6px;
                     background: var(--r-bg); color: var(--r-tx); animation: livepulse 1.6s ease-in-out infinite; }
        @keyframes livepulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        .dl-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
        .dl-row:empty { display: none; }
        .dl { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; background: var(--card);
              border: 1px solid var(--line); color: var(--text); border-radius: 12px; padding: 10px 14px; font-size: 14px; font-weight: 600; }
        .dl .sub { color: var(--text2); font-weight: 400; font-size: 13px; }
        .mk-note { font-size: 14px; color: var(--text3); border: 1px dashed var(--line2); border-radius: 12px; padding: 10px 12px; }
        .pb { min-height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--card2); display: flex;
              align-items: center; justify-content: center; gap: 8px; padding: 6px 10px; font-family: var(--mono);
              font-size: 17px; font-weight: 600; color: var(--text); }
        .pb.pass { min-height: 46px; background: transparent; border-style: dashed; border-color: var(--line2); color: var(--text2); font-size: 16px; }
        .pb .pr { font-size: 14px; color: var(--text2); font-weight: 500; }
        .mk-open { font-size: 13px; color: var(--text3); margin-top: 6px; }
        .clv-b { color: var(--green, #3fb950); font-weight: 600; }
        .clv-l { color: var(--red, #f85149); font-weight: 600; }
            .pinq { color: #9ad0ff; font-weight: 600; white-space: nowrap; }
</style>
</head>
<body>
    <div id="auth-gate" style="padding:40px;text-align:center;color:var(--text2)">Checking access…</div>
    <div id="app" style="display:none">
        <div class="topbar">
            <div class="nav">
                <a href="/">Home</a>
                <a href="/dashboard" class="admin-only" style="display:none">Dashboard</a>
                <a href="/bet-sheets" class="admin-only" style="display:none">Bet Sheets</a>
                <a href="/pick-sheets" class="on">Pick Sheets</a>
            </div>
            <button class="logout" onclick="doLogout()">Log out</button>
        </div>

        <div class="wrap">
            <div class="hd">
                <div class="hd1"><h1>Pick Sheets</h1><span class="hd-date" id="todayLbl"></span></div>
                <div class="runinfo" id="runInfo"></div>
            </div>
            <div class="seg" style="margin-top:6px">
                <button class="tab on" data-sport="NHL" aria-label="NHL" onclick="switchSport('NHL')"><span class="lg"><img src="/league-logo/NHL.png" alt="" onerror="this.parentNode.classList.add('nolg')"></span><span class="tl">NHL</span></button>
                <button class="tab" data-sport="NBA" aria-label="NBA" onclick="switchSport('NBA')"><span class="lg"><img src="/league-logo/NBA.png" alt="" onerror="this.parentNode.classList.add('nolg')"></span><span class="tl">NBA</span></button>
                <button class="tab" data-sport="MLB" aria-label="MLB" onclick="switchSport('MLB')"><span class="lg"><img src="/league-logo/MLB.png" alt="" onerror="this.parentNode.classList.add('nolg')"></span><span class="tl">MLB</span></button>
                <button class="tab" data-sport="NCAAF" aria-label="College football" onclick="switchSport('NCAAF')"><span class="lg"><img src="/league-logo/NCAAF.png" alt="" onerror="this.parentNode.classList.add('nolg')"></span><span class="tl">College</span></button>
                <button class="tab" data-sport="NFL" aria-label="NFL" onclick="switchSport('NFL')"><span class="lg"><img src="/league-logo/NFL.png" alt="" onerror="this.parentNode.classList.add('nolg')"></span><span class="tl">NFL</span></button>
            </div>
            <div class="chips" id="fchips"></div>
            <input class="search" id="search" type="search" placeholder="Search a game or team…"
                   autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                   oninput="renderGames()">
            <div class="dl-row" id="dlRow"></div>
            <div class="meta" id="metaLine">loading…</div>
            <div id="games"><div class="empty">loading…</div></div>
            <div class="hint" id="hint"></div>
        </div>
    </div>

<script>
    async function authFetch(url, options = {}) {
        const user = firebase.auth().currentUser;
        if (!user) { window.location.href = '/'; return null; }
        const token = await user.getIdToken();
        const headers = { ...(options.headers || {}), 'Authorization': 'Bearer ' + token };
        return fetch(url, { ...options, headers });
    }

    function doLogout() {
        firebase.auth().signOut().then(() => { window.location.href = '/'; });
    }

    function _gateServerError(detail) {
        try { document.querySelectorAll('#auth-gate,#app').forEach(function (el) { el.style.display = 'none'; }); } catch (e) {}
        var o = document.createElement('div');
        o.style.cssText = 'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;'
            + 'justify-content:center;padding:24px;background:#0b0f14;color:#e6edf3;'
            + 'font:15px/1.55 system-ui,-apple-system,sans-serif;text-align:center';
        o.innerHTML = '<div style="max-width:460px">'
            + '<div style="font-size:34px;margin-bottom:12px">⚠️</div>'
            + '<div style="font-size:18px;font-weight:600;margin-bottom:8px">Server error &mdash; not a permissions problem</div>'
            + '<div style="color:#9aa7b4;margin-bottom:18px">You are still signed in. This is a backend fault, not your account.</div>'
            + '<div style="font:12px ui-monospace,monospace;color:#6e7d8d;margin-bottom:18px">' + String(detail || '') + '</div>'
            + '<button id="_gateRetry" style="background:#1f6feb;color:#fff;border:0;border-radius:8px;'
            + 'padding:10px 18px;font-size:14px;cursor:pointer;margin-right:8px">Retry</button>'
            + '<a href="/" style="color:#9aa7b4;font-size:14px">Home</a></div>';
        document.body.appendChild(o);
        var b = document.getElementById('_gateRetry');
        if (b) b.onclick = function () { location.reload(); };
    }

    let _sport = 'NHL';
    const _daily = () => _sport === 'NHL' || _sport === 'NBA' || _sport === 'MLB';
    function switchSport(s) {
        _sport = s;
        document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.sport === s));
        load();
    }

    function fmtTime(iso) {
        if (!iso) return 'TBD';
        const d = new Date(iso);
        return d.toLocaleString('en-US', { timeZone: 'America/Phoenix', weekday: 'short', month: 'short', day: 'numeric' });
    }
    function fmtClock(iso) {
        if (!iso) return '';
        const d = new Date(iso);
        return d.toLocaleTimeString('en-US', { timeZone: 'America/Phoenix', hour: 'numeric', minute: '2-digit' });
    }
    // "Toronto Maple Leafs" → "Toronto", not "Toronto Maple": two-word nicknames.
    const _TWO_WORD = /\s(Maple Leafs|Red Wings|Blue Jackets|Golden Knights|Red Sox|White Sox|Blue Jays|Trail Blazers|Golden Bears|Green Wave|Red Raiders|Blue Devils|Tar Heels|Fighting Irish|Yellow Jackets|Crimson Tide|Sun Devils|Golden Gophers|Nittany Lions|Scarlet Knights|Horned Frogs|Demon Deacons|Golden Flashes|Mean Green|Black Knights|Golden Eagles|Ragin' Cajuns|Rainbow Warriors|Golden Hurricane|Red Wolves|Thundering Herd|Blue Hens|Wolf Pack|Fighting Illini)$/;
    function shortTeam(name) {
        if (!name) return '?';
        const two = name.match(_TWO_WORD);
        if (two) return name.slice(0, two.index);
        const parts = name.split(' ');
        return parts.length > 1 ? parts.slice(0, -1).join(' ') : name;
    }
    function ago(iso) {
        if (!iso) return 'never';
        const sec = (Date.now() - new Date(iso).getTime()) / 1000;
        if (sec < 90) return 'just now';
        if (sec < 5400) return Math.round(sec / 60) + 'm ago';
        if (sec < 172800) return Math.round(sec / 3600) + 'h ago';
        return Math.round(sec / 86400) + 'd ago';
    }

    // The model's projected final, from its two numbers (Rob, Oct 12 2026):
    // home = (total − home line) / 2, away = (total + home line) / 2.
    function modelScore(g) {
        const M = g.model;
        if (!M || M.spread_home == null || M.total == null) return '';
        const t = Number(M.total), s = Number(M.spread_home);
        const h = (t - s) / 2, a = (t + s) / 2;
        return '<span>📊 Model ' + esc(nameOf(g, 'away')) + ' ' + a.toFixed(1) + ' – ' + esc(nameOf(g, 'home')) + ' ' + h.toFixed(1) + '</span>';
    }
    // Verdict pills: PLAY light green, LEAN light yellow (Rob, Oct 12 2026).
    function verdictBadge(v) {
        const k = v === 'play' ? 'play' : v === 'lean' ? 'lean' : 'pass';
        return '<span class="pill ' + k + '">' + k.toUpperCase() + '</span>';
    }
    // ✅/❌/➖ after a pick once the box's 09:00 grader has stamped the row
    // (data_blob.grade, written by grade_football_sheets --write).
    function gradeMark(g, key, sub) {
        let r = g.grade && g.grade[key];
        if (sub) r = r && r[sub];
        if (r === 'win') return ' <span class="gr gr-win" title="won">✅</span>';
        if (r === 'loss') return ' <span class="gr gr-loss" title="lost">❌</span>';
        if (r === 'push') return ' <span class="gr gr-push" title="push">➖</span>';
        return '';
    }
    // the game's TV channel(s), off ESPN's scoreboard (/api/pick-sheets → tv)
    function tvText(g) { return g.tv && g.tv.length ? g.tv.slice(0, 2).join(' / ') : ''; }
    function tvChip(g) { const t = tvText(g); return t ? '<span class="tv">📺 ' + esc(t) + '</span>' : ''; }
    function finalChip(g) {
        const f = g.grade && g.grade.final;
        if (!f || f.away === undefined || f.home === undefined) return '';
        return '<span class="final">FINAL ' + nameOf(g, 'away') + ' ' + f.away + ' · ' + nameOf(g, 'home') + ' ' + f.home + '</span>';
    }
    function sgn(x, d) {
        if (x === null || x === undefined) return '—';
        const v = Number(x).toFixed(d === undefined ? 1 : d);
        return (Number(v) > 0 ? '+' : '') + v;
    }
    function am(x) {
        if (x === null || x === undefined) return '';
        x = Math.round(Number(x));
        return x > 0 ? '+' + x : String(x);
    }
    // Implied probability of an American price (with the vig still in).
    function impl(x) {
        if (x === null || x === undefined || x === '') return null;
        x = Number(x);
        if (!isFinite(x) || x === 0) return null;
        return x > 0 ? 100 / (x + 100) : -x / (-x + 100);
    }
    function pct(p) { return (p === null || p === undefined) ? '' : Math.round(p * 1000) / 10 + '%'; }
    // "+130 (43.5%)" — every price on the sheet in both languages.
    function amp(x) {
        const a = am(x);
        if (!a) return '';
        const p = impl(x);
        return a + (p === null ? '' : ' <span class="dim">(' + pct(p) + ')</span>');
    }
    // A probability printed as its fair American price: "52.0% (-108)".
    function pam(p) {
        if (p === null || p === undefined) return '';
        p = Number(p);
        if (!(p > 0 && p < 1)) return pct(p);
        const a = p >= 0.5 ? -100 * p / (1 - p) : 100 * (1 - p) / p;
        return pct(p) + ' <span class="dim">(' + am(a) + ')</span>';
    }
    function nameOf(g, side) {
        if (_sport === 'NHL') return g[side + '_short'] || shortTeam(g[side]);
        return g[side + '_short'] || shortTeam(g[side]);
    }
    // A home-oriented spread printed the way a book prints it: the favorite
    // and its number ("NEB -14.5"); pick'em when it's zero.
    function favLine(g, homeLine, d) {
        if (homeLine === null || homeLine === undefined) return '—';
        const x = Number(homeLine);
        if (Math.abs(x) < 0.05) return "pick'em";
        return x < 0 ? nameOf(g, 'home') + ' ' + sgn(x, d) : nameOf(g, 'away') + ' ' + sgn(-x, d);
    }
    // BET105 = PINNACLE (Oct 19 2026, measured: 18 numbers on three CFB
    // games, 15 identical, 3 off a cent). Bet105 has no feed we can reach,
    // so Pinnacle's price at the sheet's line is printed as the Bet105
    // number next to the pick (`g.pin`, one shape on every sport). A side →
    // that side's price; no side → both.
    function pinTxt(g, mt, side) {
        const P = g.pin;
        if (!P) return '';
        let s = '';
        if (mt === 'ml') {
            s = side ? am(P['ml_' + side])
              : (P.ml_away != null && P.ml_home != null ? nameOf(g, 'away') + ' ' + am(P.ml_away) + ' / ' + nameOf(g, 'home') + ' ' + am(P.ml_home) : '');
        } else if (mt === 'total') {
            s = side ? am(P[side + '_odds'])
              : (P.over_odds != null && P.under_odds != null ? 'O ' + am(P.over_odds) + ' / U ' + am(P.under_odds) : '');
        } else {
            s = side ? am(P[side === 'home' ? 'spread_home_odds' : 'spread_away_odds'])
              : (P.spread_home_odds != null && P.spread_away_odds != null ? favLine(g, P.spread_home, 1) + ' ' + am(P.spread_home_odds) + ' / ' + am(P.spread_away_odds) : '');
        }
        if (!s) return '';
        return ' <span class="pinq" title="Bet105\'s price at this line (Bet105 resells Pinnacle\'s lines; this is Pinnacle\'s feed)">Bet105 ' + s + '</span>';
    }

    // ---------- the Bet Sheets layout, read-only (Rob, Oct 11 2026: "keep
    // this same kind of feel on the Pick Sheet, obviously they can't bet").
    // One block per market: label · verdict · the model, then ONE box with
    // the model's side (dashed and quiet on a PASS); on a final, its ✅/❌.
    function clk(iso) { return fmtClock(iso).replace(' AM', 'a').replace(' PM', 'p'); }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }
    function mkRow(label, pick, modelHtml, body) {
        const v = pick ? (pick.verdict || 'pass') : null;
        return '<div class="mk' + (v === 'pass' ? ' pass' : '') + '"><div class="mk-h"><span class="mk-l">' + label + '</span>'
             + (v ? verdictBadge(v) : '') + (modelHtml ? '<span class="mk-m">' + modelHtml + '</span>' : '') + '</div>'
             + (body || '') + '</div>';
    }
    function edgeTxt(p, pts) {
        if (!p) return '';
        const e = pts ? sgn(p.edge_pts) + ' pts' : sgn(p.edge_pp) + '%';
        return ' <span class="dim">· edge ' + e + (p.fair != null ? ' · fair ' + am(p.fair) : '') + '</span>';
    }
    function pickBox(p, label, price, grade) {
        return '<div class="pb' + (p.verdict === 'pass' ? ' pass' : '') + '">' + esc(label)
             + (price != null ? ' <span class="pr">' + am(price) + '</span>' : '') + (grade || '') + '</div>';
    }
    // The box's grader doesn't grade the puck line; read it off the final.
    function puckGrade(g, p) {
        const f = g.grade && g.grade.final;
        if (!f || f.home == null || f.away == null || p.line == null) return '';
        const m = (p.side === 'home' ? f.home - f.away : f.away - f.home) + Number(p.line);
        return m > 0 ? ' <span class="gr gr-win" title="won">✅</span>' : m < 0 ? ' <span class="gr gr-loss" title="lost">❌</span>' : ' <span class="gr gr-push" title="push">➖</span>';
    }
    function mkBody(g, p, line, label, price, gradeKey) {
        if (!p || !p.side || line == null) return '';
        const grade = gradeKey === 'puck' ? puckGrade(g, p) : gradeMark(g, gradeKey);
        if (g._st === 'final') return p.verdict !== 'pass' ? '<div class="mk-x">' + esc(label) + grade + '</div>' : '';
        return pickBox(p, label, price, '');
    }
    // where the line came from: PIN = Pinnacle; anything else is the fallback and says so
    function srcTag(s) {
        if (!s) return '';
        return ' <span class="dim" title="line source">' + (s === 'pinnacle' ? 'PIN' : String(s).toUpperCase().slice(0, 8)) + '</span>';
    }
    function footballMarkets(g) {
        const L = g.line || {}, M = g.model, bs = g.spread, out = [];
        let mdl = M ? 'model ' + favLine(g, M.spread_home, 1) : (g.unrated ? '<span class="unrated">unrated</span>' : '');
        if (L.spread_home != null && !bs) mdl = 'line ' + favLine(g, L.spread_home, 1) + (mdl ? ' · ' + mdl : '');
        let ln = null;
        if (bs && L.spread_home != null) ln = bs.side === 'home' ? Number(L.spread_home) : -Number(L.spread_home);
        if (bs || L.spread_home != null || M)
            out.push(mkRow('Spread', bs, mdl + edgeTxt(bs, true) + srcTag((g.line_src || {}).spread) + pinTxt(g, 'spread', bs ? bs.side : null),
                     mkBody(g, bs, ln, bs ? nameOf(g, bs.side) + ' ' + sgn(ln, 1) : '', null, 'spread')));
        out.push(totalMarket(g, true));
        return out.join('');
    }
    // THE OPENING TOTAL (Oct 17 2026): the NHL total's edge lives at the
    // opening number — the first play/lean price, and whether the market has
    // since moved to it (the last pre-game run is the close).
    function openTxt(g) {
        const o = g.total_open;
        if (!o || !o.side) return '';
        const now = o.now || {};
        const moved = now.line != null && Number(now.line) !== Number(o.line) ? ' · now ' + now.line
                    : (now.price != null && now.price !== o.price ? ' · now ' + am(now.price) : '');
        const c = o.clv === 'beat' ? ' <span class="clv-b" title="the market moved to our side">✓ market moved our way</span>'
                : o.clv === 'lost' ? ' <span class="clv-l" title="the market moved against us">✗ market moved away</span>' : '';
        return '<div class="mk-open">Opened ' + (o.side === 'over' ? 'Over ' : 'Under ') + o.line
             + (o.price != null ? ' ' + am(o.price) : '') + moved + c + '</div>';
    }
    function totalMarket(g, pts) {
        const L = g.line || {}, M = g.model, p = g.total;
        let mdl = M && M.total != null ? 'model ' + Number(M.total).toFixed(1) : '';
        const tl = p && p.line != null ? p.line : L.total;
        if (tl != null && !p) mdl = 'line ' + tl + (mdl ? ' · ' + mdl : '');
        if (!p && tl == null && !mdl) return '';
        return mkRow('Total', p, mdl + edgeTxt(p, pts) + (pts ? srcTag((g.line_src || {}).total) : '') + pinTxt(g, 'total', p ? p.side : null),
                     mkBody(g, p, tl, p ? (p.side === 'over' ? 'Over ' : 'Under ') + tl : '', p ? p.price : null, 'total') + openTxt(g));
    }
    // THE CHALK RULE (Rob, Oct 11 2026: "-180 and a -262? Yeah, I ain't
    // betting that"): a chalky ML pick (server `ml.chalky`, ≤ −150) keeps its
    // verdict as information; the play is the puck line (hockey) or the spread (NBA).
    function mlMarket(g) {
        const L = g.line || {}, M = g.model, p = g.ml;
        let mdl = '';
        if (M && M.win_home != null) {
            const wh = Number(M.win_home);
            mdl = 'model ' + (wh >= 0.5 ? nameOf(g, 'home') + ' ' + pct(wh) : nameOf(g, 'away') + ' ' + pct(1 - wh));
        } else if (g.unrated) mdl = '<span class="unrated">unrated</span>';
        if (!p && L.ml_away != null && L.ml_home != null) mdl = nameOf(g, 'away') + ' ' + am(L.ml_away) + ' · ' + nameOf(g, 'home') + ' ' + am(L.ml_home) + (mdl ? ' · ' + mdl : '');
        if (!p && !mdl) return '';
        let body = mkBody(g, p, 0, p && p.side ? nameOf(g, p.side) + ' ML' : '', p ? (p.price != null ? p.price : L['ml_' + p.side]) : null, 'ml');
        if (p && p.chalky && g._st !== 'final') body = '<div class="mk-note">' + esc(nameOf(g, p.side)) + ' ' + am(p.price) + ' is too chalky to bet — ' + (_sport === 'NHL' ? 'see the puck line' : _sport === 'MLB' ? 'see the run line' : 'see the spread') + '.</div>';
        return mkRow('ML', p, mdl + edgeTxt(p, false) + srcTag(L.provider) + pinTxt(g, 'ml', p ? p.side : null), body);
    }
    // NBA spread (Hoops IQ: LEAN at most — no backtested edge vs the close)
    function nbaSpreadMarket(g) {
        const L = g.line || {}, M = g.model, p = g.spread;
        let mdl = M && M.spread_home != null ? 'model ' + favLine(g, M.spread_home, 1) : '';
        if (!p && L.spread_home != null) mdl = 'line ' + favLine(g, L.spread_home, 1) + (mdl ? ' · ' + mdl : '');
        if (!p && !mdl) return '';
        let ln = null;
        if (p && p.side) ln = p.line != null ? Number(p.line) : (L.spread_home != null ? (p.side === 'home' ? Number(L.spread_home) : -Number(L.spread_home)) : null);
        return mkRow(_sport === 'MLB' ? 'Run line' : 'Spread', p, mdl + edgeTxt(p, false) + pinTxt(g, 'spread', p ? p.side : null),
                     mkBody(g, p, ln, p && p.side ? nameOf(g, p.side) + ' ' + sgn(ln, 1) : '', p ? p.price : null, 'spread'));
    }
    // Hockey puck line: priced server-side like the ML (`g.puck`).
    function puckMarket(g) {
        const L = g.line || {}, M = g.model, p = g.puck;
        let mdl = M && M.spread_home != null ? 'model ' + favLine(g, M.spread_home, 2) : '';
        if (!p && L.puck_home != null) {
            const po = Number(L.puck_home) < 0 ? L.puck_home_odds : L.puck_away_odds;
            mdl = 'line ' + favLine(g, L.puck_home, 1) + (po != null ? ' ' + am(po) : '') + (mdl ? ' · ' + mdl : '');
        }
        if (!p && !mdl) return '';
        return mkRow('Puck', p, mdl + edgeTxt(p, false) + pinTxt(g, 'spread', p ? p.side : null),
                     mkBody(g, p, p ? p.line : null, p && p.side ? nameOf(g, p.side) + ' ' + sgn(p.line, 1) : '', p ? p.price : null, 'puck'));
    }
    function marketsFor(g) {
        if (_sport === 'NHL') return mlMarket(g) + puckMarket(g) + totalMarket(g, false);
        if (_sport === 'NBA' || _sport === 'MLB') return mlMarket(g) + nbaSpreadMarket(g) + totalMarket(g, false);
        return footballMarkets(g);
    }
    function hasPick(g) {
        return ['ml', 'spread', 'total', 'puck'].some(k => g[k] && !g[k].chalky && (g[k].verdict === 'play' || g[k].verdict === 'lean'));
    }

    // LAST / NEXT SHEET RUN, AZ time (same line as Bet Sheets).
    function azClock(iso) {
        if (!iso) return '—';
        const t = new Date(iso);
        const day = t.toLocaleDateString('en-US', { timeZone: 'America/Phoenix', weekday: 'short' });
        const today = new Date().toLocaleDateString('en-US', { timeZone: 'America/Phoenix', weekday: 'short' });
        return (day === today ? '' : day + ' ') + clk(iso);
    }
    function renderRunInfo(d) {
        document.getElementById('runInfo').innerHTML = d ? 'Sheet ran <b>' + azClock(d.lines_updated_at) + '</b>'
            + (d.lines_updated_at ? ' (' + ago(d.lines_updated_at) + ')' : '') + ' · next <b>' + azClock(d.next_run_at) + '</b>' : '';
    }

    async function load() {
        document.getElementById('metaLine').textContent = 'loading…';
        document.getElementById('games').innerHTML = '<div class="empty">loading…</div>';
        let r;
        try {
            r = await authFetch('/api/pick-sheets?sport=' + _sport);
        } catch (e) { document.getElementById('metaLine').textContent = 'fetch failed: ' + e; return; }
        if (!r) return;
        if (r.status >= 500) { document.getElementById('metaLine').textContent = 'server error ' + r.status; return; }
        const d = await r.json().catch(() => null);
        if (!d || !d.ok) { document.getElementById('metaLine').textContent = 'error: ' + (d && d.error || 'unknown'); renderRunInfo(null); return; }
        renderRunInfo(d);

        const dl = document.getElementById('dlRow');
        dl.innerHTML = '';
        if (d.pdf_url) dl.innerHTML += '<a class="dl" href="' + d.pdf_url + '" target="_blank">📄 Full sheet pack<span class="sub"> · deep dives</span></a>';
        if (d.picks_pdf_url) dl.innerHTML += '<a class="dl" href="' + d.picks_pdf_url + '" target="_blank">📋 Picks only<span class="sub"> · one page</span></a>';

        if (!d.week_key || !d.games || !d.games.length) {
            document.getElementById('metaLine').textContent = d.note || 'no sheets for this sport yet';
            _games = [];
            renderFilters();
            document.getElementById('games').innerHTML = '<div class="empty">' + (_daily() ? 'No upcoming games on the sheet yet.' : 'Nothing built yet — check back after the Monday run.') + '</div>';
            return;
        }
        _meta = _daily() ? d.games.length + ' games' : 'Week of ' + d.week_key + ' · ' + d.games.length + ' games';
        document.getElementById('hint').innerHTML = _sport === 'NBA'
            ? 'Model = Hoops IQ (pace × efficiency, opponent-adjusted, rest, who is OUT). ML play ≥ 4% over the no-vig line, lean ≥ 2%. Spread and total are LEAN at most — neither has beaten the closing number in backtest. A favorite at −150 or shorter is too chalky to bet on the ML — take the spread. Injuries read at build time — check late scratches.'
            : _sport === 'MLB'
            ? 'Model = Diamond IQ (starter FIP, bullpen + fatigue, lineup wOBA, park). It trails the betting market in backtest, so every pick is LEAN at most — ML and run line need 4% over the no-vig price. The total is our number only, never a pick (the totals model failed its backtest). A favorite at −150 or shorter is too chalky to bet on the ML — see the run line. Starters are ESPN probables; * = no starts on record.'
            : _sport === 'NHL'
            ? 'Model = Crease IQ v2 (score model: xG, goalies, rest). ML and puck line: play ≥ 4% over the no-vig price, lean ≥ 2%. A favorite at −150 or shorter is too chalky to bet on the ML — the puck line is the play. Totals are LEAN at most. Starting goalies are projected until confirmed.'
            : 'Model spread/total = our number (calibrated). Edges in points; fair = the price the bet is good to. PIN = Pinnacle\'s line. Bet105 = Pinnacle\'s price at it (they resell Pinnacle), the number to bet it at on Bet105.';
        _games = d.games.slice().sort((a, b) => (a.event_start || '').localeCompare(b.event_start || ''));
        renderGames();
    }

    // The search bar (Rob, Oct 3 2026) filters the loaded sheet client-side:
    // every typed word must appear in either team's full or short name.
    let _games = [], _meta = '';
    function gameMatches(g, words) {
        if (!words.length) return true;
        const hay = [g.away, g.home, g.away_short, g.home_short, shortTeam(g.away), shortTeam(g.home)]
            .filter(Boolean).join(' ').toLowerCase();
        return words.every(w => hay.includes(w));
    }
    // 'up' = not started; 'final' = graded final or started > FINAL_AFTER_H
    // ago (a grade lands within ~5 min of the final); 'live' = in between.
    const FINAL_AFTER_H = { NHL: 3.5, NBA: 3.0, MLB: 3.5, NFL: 4.5, NCAAF: 4.5 };
    function gameStatus(g) {
        const t = g.event_start ? new Date(g.event_start).getTime() : null;
        if (t === null || t > Date.now()) return 'up';
        if (g.grade && g.grade.final) return 'final';
        const h = (Date.now() - t) / 3600000;
        return h > (FINAL_AFTER_H[_sport] || 4) ? 'final' : 'live';
    }
    let _filter = 'all';
    try { _filter = localStorage.getItem('kh_ps_filter_v1') || 'all'; } catch (e) {}
    function setFilter(f) {
        _filter = f;
        try { localStorage.setItem('kh_ps_filter_v1', f); } catch (e) {}
        renderGames();
    }
    function renderFilters() {
        const n = _games.filter(g => gameStatus(g) !== 'final' && hasPick(g)).length;
        const c = (f, t) => '<button class="fchip' + (_filter === f ? ' on' : '') + '" onclick="setFilter(\'' + f + '\')">' + t + '</button>';
        document.getElementById('fchips').innerHTML = c('all', 'All games') + c('plays', 'Plays & leans ' + n);
    }
    function renderGames() {
        const q = (document.getElementById('search').value || '').trim().toLowerCase();
        const words = q.split(/\s+/).filter(Boolean);
        _games.forEach(g => { g._st = gameStatus(g); });
        renderFilters();
        let games = _games.filter(g => gameMatches(g, words));
        if (_filter === 'plays') games = games.filter(g => hasPick(g));
        const rec = { win: 0, loss: 0, push: 0 };
        for (const g of _games) {
            for (const k of ['ml', 'spread', 'total']) {
                const r = g.grade && g.grade[k];
                if (r in rec) rec[r]++;
            }
        }
        document.getElementById('metaLine').innerHTML = esc(_meta) + (rec.win + rec.loss + rec.push
            ? ' · picks <b>' + rec.win + '-' + rec.loss + (rec.push ? '-' + rec.push : '') + '</b>' + (rec.win + rec.loss ? ' (' + Math.round(100 * rec.win / (rec.win + rec.loss)) + '%)' : '')
            : '');
        // ORDER: in-play first with a LIVE flag, then upcoming soonest-first
        // under day headers, then finals (most recent first).
        const live = games.filter(g => g._st === 'live');
        const up = games.filter(g => g._st === 'up');
        const fin = games.filter(g => g._st === 'final').reverse();
        const ordered = live.concat(up, fin);
        if (!ordered.length) {
            document.getElementById('games').innerHTML = '<div class="empty">' + (words.length ? 'No games match "' + esc(q) + '".'
                : _filter === 'plays' ? 'No plays or leans on the board.' : 'No games.') + '</div>';
            return;
        }
        let html = '', day = null;
        for (const g of ordered) {
            if (g._st === 'live') {
                if (day !== '__live') { html += '<div class="day-hdr">Live now</div>'; day = '__live'; }
            } else if (g._st === 'final') {
                if (day !== '__final') { html += '<div class="day-hdr">Final</div>'; day = '__final'; }
            } else {
                const dstr = fmtTime(g.event_start);
                if (dstr !== day) { html += '<div class="day-hdr">' + dstr + '</div>'; day = dstr; }
            }
            const subs = [];
            if (g._st === 'final' && finalChip(g)) subs.push(finalChip(g));
            if (_sport === 'NHL' && g.goalies) {
                const ga = (g.goalies.away || {}).name, gh = (g.goalies.home || {}).name;
                if (ga || gh) subs.push('<span>🥅 ' + esc(ga || '?') + ' vs ' + esc(gh || '?') + '</span>');
            }
            if (_sport === 'MLB') {
                const st = g.starters || {}, sa = st.away || {}, sh = st.home || {};
                const nm = x => esc(x.name || 'TBD') + (x.name && !x.rated ? '*' : '');
                if (sa.name || sh.name) subs.push('<span title="* = no starts on record — priced as a league-average arm">⚾ ' + nm(sa) + ' vs ' + nm(sh) + '</span>');
                if (g.series) subs.push('<span>' + esc(g.series) + '</span>');
            }
            if (modelScore(g)) subs.push(modelScore(g));
            if (_sport === 'NBA' && g.injuries) {
                const oa = (g.injuries.away || []), oh = (g.injuries.home || []);
                if (oa.length || oh.length) subs.push('<span>🩹 OUT ' + esc(nameOf(g, 'away')) + ': ' + esc(oa.join(', ') || '—') + ' · ' + esc(nameOf(g, 'home')) + ': ' + esc(oh.join(', ') || '—') + '</span>');
            }
            html += '<div class="gc' + (g._st === 'final' ? ' done' : '') + '"><div class="gh"><div><div class="gt">'
                  + (g._st === 'final' ? fmtTime(g.event_start).split(',')[0] + ' ' : '') + clk(g.event_start) + '</div>'
                  + '<div class="gm">' + esc(shortTeam(g.away)) + ' @ ' + esc(shortTeam(g.home)) + tvChip(g) + '</div></div>'
                  + (g._st === 'live' ? '<span class="live-flag">LIVE</span>' : '') + '</div>'
                  + (subs.length ? '<div class="gsub">' + subs.join('') + '</div>' : '')
                  + marketsFor(g) + '</div>';
        }
        document.getElementById('games').innerHTML = html;
    }

    firebase.auth().onAuthStateChanged(async user => {
        if (!user) { window.location.href = '/'; return; }
        let me = null;
        try {
            const r = await authFetch('/api/me');
            if (!r) { _gateServerError('sign-in check could not reach the server'); return; }
            if (r.status >= 500) { _gateServerError('/api/me returned ' + r.status); return; }
            me = await r.json().catch(() => null);
        } catch (e) { _gateServerError('sign-in check failed: ' + e); return; }
        if (!me || !me.ok || !(me.role === 'admin' || me.bot_access)) { window.location.href = '/'; return; }
        // bot_access = Pick Sheets access (Oct 3 2026): a friend on the pill sees
        // the sheets and nothing else — the Dashboard link renders for admins only.
        if (me.role === 'admin') document.querySelectorAll('.admin-only').forEach(el => el.style.display = '');
        document.getElementById('auth-gate').style.display = 'none';
        document.getElementById('app').style.display = '';
        document.getElementById('todayLbl').textContent = new Date().toLocaleDateString('en-US',
            { timeZone: 'America/Phoenix', weekday: 'short', month: 'short', day: 'numeric' }).replace(', ', ' · ');
        load();
        setInterval(load, 15 * 60 * 1000);
    });
</script>
</body>
</html>
