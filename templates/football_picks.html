<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --bg: #0b0e13; --surface: #13171e; --line: #232a37;
            --text: #e8edf5; --muted: #7d8799;
            --green: #34d399; --red: #f87171; --cyan: #22d3ee; --amber: #fbbf24;
        }
        * { box-sizing: border-box; }
        html, body { overflow-x: hidden; }
        body {
            margin: 0; background: var(--bg); color: var(--text);
            font-family: 'DM Sans', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line);
            flex-wrap: wrap;
        }
        .nav { display: flex; gap: 16px; flex-wrap: wrap; }
        .nav a { color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 500; }
        .nav a:hover, .nav a.on { color: var(--text); }
        .logout {
            background: none; border: 1px solid var(--line); color: var(--muted);
            border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer;
        }
        .wrap { max-width: 920px; margin: 0 auto; padding: 18px 16px 60px; }
        h1 { font-size: 20px; margin: 6px 0 14px; }
        .search {
            width: 100%; box-sizing: border-box; margin: 0 0 12px;
            background: var(--surface); border: 1px solid var(--line); color: var(--text);
            border-radius: 10px; padding: 10px 14px; font-size: 15px; font-family: inherit;
            -webkit-appearance: none;
        }
        .search:focus { outline: none; border-color: #4a7bd6; }
        .search::placeholder { color: var(--muted); }
        .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
        .tab {
            background: var(--surface); border: 1px solid var(--line); color: var(--muted);
            border-radius: 999px; padding: 7px 16px; font-size: 13px; font-weight: 600;
            cursor: pointer;
        }
        .tab.on { color: var(--bg); background: var(--cyan); border-color: var(--cyan); }
        .dl-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
        .dl {
            display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
            background: var(--surface); border: 1px solid var(--line); color: var(--text);
            border-radius: 10px; padding: 10px 14px; font-size: 13px; font-weight: 600;
        }
        .dl:hover { border-color: var(--cyan); }
        .dl .sub { color: var(--muted); font-weight: 400; font-size: 11px; }
        .meta { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
        .day-hdr {
            font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
            color: var(--muted); margin: 18px 0 6px; padding-bottom: 4px;
            border-bottom: 1px solid var(--line);
        }
        .day-hdr:first-of-type { margin-top: 0; }
        .row {
            display: flex; align-items: baseline; gap: 10px; padding: 8px 0;
            border-bottom: 1px solid var(--line); flex-wrap: wrap;
        }
        .t { width: 56px; flex: 0 0 56px; color: var(--muted); font-size: 12px;
             font-variant-numeric: tabular-nums; }
        .m { flex: 1 1 220px; font-weight: 600; font-size: 14px; }
        .legs { flex: 2 1 260px; display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; }
        .v {
            display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .06em;
            padding: 2px 7px; border-radius: 8px; margin-right: 5px; vertical-align: 1px;
        }
        .v-play { background: #103c2c; color: var(--green); }
        .v-lean { background: #4a3a10; color: var(--amber); }
        .v-pass { background: var(--surface); color: var(--muted); border: 1px solid var(--line); }
        .unrated { color: var(--muted); font-style: italic; font-size: 13px; }
        .game { padding: 10px 0; border-bottom: 1px solid var(--line); }
        .ghead { display: flex; gap: 10px; align-items: baseline; margin-bottom: 6px; flex-wrap: wrap; }
        .ghead .sub { color: var(--muted); font-size: 12px; }
        .cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
        .col { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; min-width: 0; }
        .col .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 3px; }
        .col .val { font-size: 13px; font-variant-numeric: tabular-nums; line-height: 1.5; }
        .col.picks .val div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .num { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; }
        .dim { color: var(--muted); font-size: 11.5px; }
        .gr { margin-left: 4px; font-size: 13px; }
        .gr-win { color: var(--green); } .gr-loss { color: #e05a5a; } .gr-push { color: var(--muted); }
        .final { color: var(--text); font-weight: 600; font-size: 12px; background: var(--surface);
                 border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; }
        .record { color: var(--muted); font-size: 12px; margin: -10px 0 14px; }
        .gap-pos { color: var(--green); }
        @media (max-width: 560px) { .cols { grid-template-columns: 1fr; } }
        .mbox { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 4px 9px; }
        .mrow { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; padding: 3px 0; font-size: 13px; line-height: 1.35; }
        .mrow + .mrow { border-top: 1px solid var(--line); }
        .mk { flex: 0 0 44px; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
        .mp { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; }
        .mp .v { margin-right: 6px; }
        .mm { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; }
        .mm .dim { font-family: 'DM Sans', system-ui, sans-serif; }
        .md { font-size: 11.5px; }
        .live-hdr { color: var(--red); border-bottom-color: #4a1f1f; }
        .live-flag { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .08em; padding: 2px 7px; border-radius: 8px;
                     background: #3c1414; color: var(--red); vertical-align: 1px; animation: livepulse 1.6s ease-in-out infinite; }
        @keyframes livepulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
        .game.done { opacity: .72; }
        .game.done .t { width: auto; flex-basis: auto; }
        .empty { color: var(--muted); padding: 40px 0; text-align: center; }
        .refresh-hint { color: var(--muted); font-size: 12px; margin-top: 24px; text-align: center; }
    </style>
</head>
<body>
    <div id="auth-gate" style="padding:40px;text-align:center;color:var(--muted)">Checking access…</div>
    <div id="app" style="display:none">
        <div class="topbar">
            <div class="nav">
                <a href="/">Home</a>
                <a href="/dashboard" class="admin-only" style="display:none">Dashboard</a>
                <a href="/pick-sheets" class="on">Pick Sheets</a>
            </div>
            <button class="logout" onclick="doLogout()">Log out</button>
        </div>

        <div class="wrap">
            <h1>Pick Sheets</h1>
            <input class="search" id="search" type="search" placeholder="Search a game or team…"
                   autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                   oninput="renderGames()">
            <div class="tabs">
                <button class="tab on" data-sport="NHL" onclick="switchSport('NHL')">🏒 Hockey</button>
                <button class="tab" data-sport="NBA" onclick="switchSport('NBA')">🏀 NBA</button>
                <button class="tab" data-sport="NCAAF" onclick="switchSport('NCAAF')">🏈 College</button>
                <button class="tab" data-sport="NFL" onclick="switchSport('NFL')">🏈 NFL</button>
            </div>
            <div class="dl-row" id="dlRow"></div>
            <div class="meta" id="metaLine">loading…</div>
            <div id="games"><div class="empty">loading…</div></div>
            <div class="refresh-hint" id="hint"></div>
        </div>
    </div>

<script>
    async function authFetch(url, options = {}) {
        const user = firebase.auth().currentUser;
        if (!user) { window.location.href = '/'; return null; }
        const token = await user.getIdToken();
        const headers = { ...(options.headers || {}), 'Authorization': 'Bearer ' + token };
        return fetch(url, { ...options, headers });
    }

    function doLogout() {
        firebase.auth().signOut().then(() => { window.location.href = '/'; });
    }

    function _gateServerError(detail) {
        try { document.querySelectorAll('#auth-gate,#app').forEach(function (el) { el.style.display = 'none'; }); } catch (e) {}
        var o = document.createElement('div');
        o.style.cssText = 'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;'
            + 'justify-content:center;padding:24px;background:#0b0f14;color:#e6edf3;'
            + 'font:15px/1.55 system-ui,-apple-system,sans-serif;text-align:center';
        o.innerHTML = '<div style="max-width:460px">'
            + '<div style="font-size:34px;margin-bottom:12px">⚠️</div>'
            + '<div style="font-size:18px;font-weight:600;margin-bottom:8px">Server error &mdash; not a permissions problem</div>'
            + '<div style="color:#9aa7b4;margin-bottom:18px">You are still signed in. This is a backend fault, not your account.</div>'
            + '<div style="font:12px ui-monospace,monospace;color:#6e7d8d;margin-bottom:18px">' + String(detail || '') + '</div>'
            + '<button id="_gateRetry" style="background:#1f6feb;color:#fff;border:0;border-radius:8px;'
            + 'padding:10px 18px;font-size:14px;cursor:pointer;margin-right:8px">Retry</button>'
            + '<a href="/" style="color:#9aa7b4;font-size:14px">Home</a></div>';
        document.body.appendChild(o);
        var b = document.getElementById('_gateRetry');
        if (b) b.onclick = function () { location.reload(); };
    }

    let _sport = 'NHL';
    const _daily = () => _sport === 'NHL' || _sport === 'NBA';
    function switchSport(s) {
        _sport = s;
        document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.sport === s));
        load();
    }

    function fmtTime(iso) {
        if (!iso) return 'TBD';
        const d = new Date(iso);
        return d.toLocaleString('en-US', { timeZone: 'America/Phoenix', weekday: 'short', month: 'short', day: 'numeric' });
    }
    function fmtClock(iso) {
        if (!iso) return '';
        const d = new Date(iso);
        return d.toLocaleTimeString('en-US', { timeZone: 'America/Phoenix', hour: 'numeric', minute: '2-digit' });
    }
    function shortTeam(name) {
        if (!name) return '?';
        const parts = name.split(' ');
        return parts.length > 1 ? parts.slice(0, -1).join(' ') : name;
    }
    function ago(iso) {
        if (!iso) return 'never';
        const sec = (Date.now() - new Date(iso).getTime()) / 1000;
        if (sec < 90) return 'just now';
        if (sec < 5400) return Math.round(sec / 60) + 'm ago';
        if (sec < 172800) return Math.round(sec / 3600) + 'h ago';
        return Math.round(sec / 86400) + 'd ago';
    }

    function verdictBadge(v) {
        if (v === 'play') return '<span class="v v-play">PLAY</span>';
        if (v === 'lean') return '<span class="v v-lean">LEAN</span>';
        return '<span class="v v-pass">PASS</span>';
    }
    // ✅/❌/➖ after a pick once the box's 09:00 grader has stamped the row
    // (data_blob.grade, written by grade_football_sheets --write).
    function gradeMark(g, key, sub) {
        let r = g.grade && g.grade[key];
        if (sub) r = r && r[sub];
        if (r === 'win') return ' <span class="gr gr-win" title="won">✅</span>';
        if (r === 'loss') return ' <span class="gr gr-loss" title="lost">❌</span>';
        if (r === 'push') return ' <span class="gr gr-push" title="push">➖</span>';
        return '';
    }
    function finalChip(g) {
        const f = g.grade && g.grade.final;
        if (!f || f.away === undefined || f.home === undefined) return '';
        return '<span class="final">FINAL ' + nameOf(g, 'away') + ' ' + f.away + ' · ' + nameOf(g, 'home') + ' ' + f.home + '</span>';
    }
    function sgn(x, d) {
        if (x === null || x === undefined) return '—';
        const v = Number(x).toFixed(d === undefined ? 1 : d);
        return (Number(v) > 0 ? '+' : '') + v;
    }
    function am(x) {
        if (x === null || x === undefined) return '';
        x = Math.round(Number(x));
        return x > 0 ? '+' + x : String(x);
    }
    // Implied probability of an American price (with the vig still in).
    function impl(x) {
        if (x === null || x === undefined || x === '') return null;
        x = Number(x);
        if (!isFinite(x) || x === 0) return null;
        return x > 0 ? 100 / (x + 100) : -x / (-x + 100);
    }
    function pct(p) { return (p === null || p === undefined) ? '' : Math.round(p * 1000) / 10 + '%'; }
    // "+130 (43.5%)" — every price on the sheet in both languages.
    function amp(x) {
        const a = am(x);
        if (!a) return '';
        const p = impl(x);
        return a + (p === null ? '' : ' <span class="dim">(' + pct(p) + ')</span>');
    }
    // A probability printed as its fair American price: "52.0% (-108)".
    function pam(p) {
        if (p === null || p === undefined) return '';
        p = Number(p);
        if (!(p > 0 && p < 1)) return pct(p);
        const a = p >= 0.5 ? -100 * p / (1 - p) : 100 * (1 - p) / p;
        return pct(p) + ' <span class="dim">(' + am(a) + ')</span>';
    }
    function nameOf(g, side) {
        if (_sport === 'NHL') return g[side + '_short'] || shortTeam(g[side]);
        return g[side + '_short'] || shortTeam(g[side]);
    }
    // A home-oriented spread printed the way a book prints it: the favorite
    // and its number ("NEB -14.5"); pick'em when it's zero.
    function favLine(g, homeLine, d) {
        if (homeLine === null || homeLine === undefined) return '—';
        const x = Number(homeLine);
        if (Math.abs(x) < 0.05) return "pick'em";
        return x < 0 ? nameOf(g, 'home') + ' ' + sgn(x, d) : nameOf(g, 'away') + ' ' + sgn(-x, d);
    }

    // ---------- one compact row per market: PICK · model · edge (Rob, Oct 3
    // 2026: "picks and model on same line… less wasted space"), with the
    // tap buttons UNDER the rows — read the pick, then tap the box.
    function mrow(label, pickHtml, modelHtml, detailHtml) {
        return '<div class="mrow"><span class="mk">' + label + '</span>'
             + '<span class="mp">' + (pickHtml || '<span class="dim">—</span>') + '</span>'
             + (modelHtml ? '<span class="mm"><span class="dim">model</span> ' + modelHtml + '</span>' : '')
             + (detailHtml ? '<span class="md dim">' + detailHtml + '</span>' : '')
             + '</div>';
    }
    function footballRows(g) {
        const L = g.line || {}, M = g.model;
        const bs = g.spread, bt = g.total;
        const rows = [];
        // where the line came from: PIN = Pinnacle (the sheet's line since Oct 5 2026);
        // anything else is the fallback (DK / ESPN consensus / exchange) and says so
        const srcTag = k => { const s = (g.line_src || {})[k]; if (!s) return '';
            return ' <span class="dim" title="line source">' + (s === 'pinnacle' ? 'PIN' : s.toUpperCase().slice(0, 8)) + '</span>'; };
        // spread
        let pk = '', det = '';
        if (bs && bs.verdict !== 'pass') {
            pk = verdictBadge(bs.verdict) + '<b>' + shortTeam(bs.team) + ' ' + sgn(bs.line) + '</b>';
            det = sgn(bs.edge_pts) + ' pts' + (bs.fair ? ', to ' + am(bs.fair) + ' / ' + pct(impl(bs.fair)) : '');
        } else if (bs) pk = verdictBadge('pass') + '<span class="dim">' + favLine(g, L.spread_home, 1) + '</span>';
        else if (L.spread_home != null) pk = '<span class="dim">' + favLine(g, L.spread_home, 1) + '</span>';
        rows.push(mrow('Spread', pk + (pk ? srcTag('spread') : ''), M ? favLine(g, M.spread_home, 1) + gradeMark(g, 'model', 'spread') : (g.unrated ? '<span class="unrated">unrated</span>' : ''), det));
        // total
        pk = ''; det = '';
        if (bt && bt.verdict !== 'pass') {
            pk = verdictBadge(bt.verdict) + '<b>' + (bt.side === 'over' ? 'Over ' : 'Under ') + bt.line + '</b>';
            det = sgn(bt.edge_pts) + ' pts' + (bt.fair ? ', to ' + am(bt.fair) + ' / ' + pct(impl(bt.fair)) : '');
        } else if (bt) pk = verdictBadge('pass') + '<span class="dim">O/U ' + bt.line + '</span>';
        else if (L.total != null) pk = '<span class="dim">O/U ' + L.total + '</span>';
        rows.push(mrow('Total', pk + (pk ? srcTag('total') : ''), M && M.total != null ? Number(M.total).toFixed(1) + gradeMark(g, 'model', 'total') : '', det));
        return rows.join('');
    }
    // NBA (Hoops IQ, Oct 2026): ML verdict like hockey; spread + total are
    // LEAN at most — no backtested edge vs the closing number yet.
    function basketballRows(g) {
        const L = g.line || {}, M = g.model;
        const rows = [hockeyRows(g, true)];
        let pk = '', det = '';
        const bs = g.spread;
        if (bs && bs.verdict !== 'pass') {
            pk = verdictBadge(bs.verdict) + '<b>' + (bs.abbr || shortTeam(bs.team)) + ' ' + sgn(bs.line) + (bs.price != null ? ' ' + am(bs.price) : '') + '</b>';
            det = 'edge ' + sgn(bs.edge_pp) + '%' + (bs.fair ? ', fair ' + am(bs.fair) : '');
        } else if (L.spread_home != null) pk = (bs ? verdictBadge('pass') : '') + '<span class="dim">' + favLine(g, L.spread_home, 1) + '</span>';
        rows.push(mrow('Spread', pk, M && M.spread_home != null ? favLine(g, M.spread_home, 1) + gradeMark(g, 'model', 'spread') : '', det));
        return rows.join('');
    }
    function hockeyRows(g, noPuck) {
        const L = g.line || {}, M = g.model;
        const rows = [];
        // moneyline
        let pk = '', det = '', mdl = '';
        if (g.ml && g.ml.verdict !== 'pass') {
            pk = verdictBadge(g.ml.verdict) + '<b>' + (g.ml.abbr || shortTeam(g.ml.team)) + ' ML ' + am(g.ml.price) + '</b>';
            det = 'edge ' + sgn(g.ml.edge_pp) + '%' + (g.ml.fair ? ', fair ' + am(g.ml.fair) : '');
        } else if (L.ml_away !== undefined && L.ml_home !== undefined) {
            pk = (g.ml ? verdictBadge('pass') : '') + '<span class="dim">' + nameOf(g, 'away') + ' ' + am(L.ml_away) + ' · ' + nameOf(g, 'home') + ' ' + am(L.ml_home) + '</span>';
        }
        if (M && M.win_home != null) {
            const wh = Number(M.win_home);
            mdl = (wh >= 0.5 ? nameOf(g, 'home') + ' ' + pct(wh) : nameOf(g, 'away') + ' ' + pct(1 - wh)) + gradeMark(g, 'model', 'ml');
        } else if (g.unrated) mdl = '<span class="unrated">unrated</span>';
        if (pk && L.provider) pk += ' <span class="dim" title="line source">' + (L.provider === 'pinnacle' ? 'PIN' : String(L.provider).toUpperCase().slice(0, 8)) + '</span>';
        rows.push(mrow('ML', pk, mdl, det));
        // total
        pk = ''; det = '';
        if (g.total && g.total.verdict !== 'pass') {
            pk = verdictBadge(g.total.verdict) + '<b>' + (g.total.side === 'over' ? 'Over ' : 'Under ') + g.total.line + (g.total.price != null ? ' ' + am(g.total.price) : '') + '</b>';
            det = 'edge ' + sgn(g.total.edge_pp) + '%' + (g.total.fair ? ', fair ' + am(g.total.fair) : '');
        } else if (L.total != null) pk = (g.total ? verdictBadge('pass') : '') + '<span class="dim">O/U ' + L.total + '</span>';
        rows.push(mrow('Total', pk, M && M.total != null ? Number(M.total).toFixed(1) + gradeMark(g, 'model', 'total') : '', det));
        // puck line (no sheet verdict — line + model margin)
        if (!noPuck && (L.puck_home !== undefined || (M && M.spread_home != null))) {
            const favHome = L.puck_home !== undefined && Number(L.puck_home) < 0;
            const po = L.puck_home !== undefined ? (favHome ? L.puck_home_odds : L.puck_away_odds) : undefined;
            pk = L.puck_home !== undefined ? '<span class="dim">' + favLine(g, L.puck_home, 1) + (po !== undefined ? ' ' + am(po) : '') + '</span>' : '';
            rows.push(mrow('Puck', pk, M && M.spread_home != null ? favLine(g, M.spread_home, 2) : '', ''));
        }
        return rows.join('');
    }

    async function load() {
        document.getElementById('metaLine').textContent = 'loading…';
        document.getElementById('games').innerHTML = '<div class="empty">loading…</div>';
        let r;
        try {
            r = await authFetch('/api/pick-sheets?sport=' + _sport);
        } catch (e) { document.getElementById('metaLine').textContent = 'fetch failed: ' + e; return; }
        if (!r) return;
        if (r.status >= 500) { document.getElementById('metaLine').textContent = 'server error ' + r.status; return; }
        const d = await r.json().catch(() => null);
        if (!d || !d.ok) { document.getElementById('metaLine').textContent = 'error: ' + (d && d.error || 'unknown'); return; }

        const dl = document.getElementById('dlRow');
        dl.innerHTML = '';
        if (d.pdf_url) {
            dl.innerHTML += '<a class="dl" href="' + d.pdf_url + '" target="_blank">📄 Full sheet pack<span class="sub"> · deep dives + roster notes</span></a>';
        }
        if (d.picks_pdf_url) {
            dl.innerHTML += '<a class="dl" href="' + d.picks_pdf_url + '" target="_blank">📋 Picks only<span class="sub"> · one page</span></a>';
        }

        if (!d.week_key || !d.games || !d.games.length) {
            document.getElementById('metaLine').textContent = d.note || 'no sheets for this sport yet';
            _games = [];
            document.getElementById('games').innerHTML = '<div class="empty">' + (_daily() ? 'No upcoming games on the sheet yet.' : 'Nothing built yet — check back after the Monday or Friday run.') + '</div>';
            return;
        }

        document.getElementById('metaLine').textContent = _daily()
            ? d.games.length + ' games · lines/model updated ' + ago(d.lines_updated_at)
            : 'Week of ' + d.week_key + ' · ' + d.games.length + ' games · sheet built ' + ago(d.built_at || d.published_at) +
              ' · lines/model updated ' + ago(d.lines_updated_at);
        document.getElementById('hint').innerHTML = _sport === 'NBA'
            ? 'Model = Hoops IQ (pace × efficiency, opponent-adjusted, rest, who is OUT). Spread = expected final margin; % = win probability. ML play ≥ 4% over the no-vig line, lean ≥ 2%. Spread and total are LEAN at most — neither has beaten the closing number in backtest. Injuries read at build time — check late scratches before betting.'
            : _sport === 'NHL'
            ? 'Model = Crease IQ v2 (score model: xG, goalies, rest). Spread = expected final goal margin; % = win probability. ML play ≥ 4% over the no-vig line, lean ≥ 2%. Totals are LEAN at most — the total model has not beaten the base rate in backtest. Starting goalies are projected until confirmed — check before betting.'
            : 'Model spread/total = our number (calibrated). Picks show the edge in points and the price the bet is good to.';

        _games = d.games.slice().sort((a, b) => (a.event_start || '').localeCompare(b.event_start || ''));
        renderGames();
    }

    // The search bar (Rob, Oct 3 2026) filters the loaded sheet client-side:
    // every typed word must appear in either team's full or short name.
    let _games = [];
    function gameMatches(g, words) {
        if (!words.length) return true;
        const hay = [g.away, g.home, g.away_short, g.home_short, shortTeam(g.away), shortTeam(g.home)]
            .filter(Boolean).join(' ').toLowerCase();
        return words.every(w => hay.includes(w));
    }
    // 'up' = not started; 'final' = graded final or started > FINAL_AFTER_H
    // ago (a grade lands within ~5 min of the final); 'live' = in between.
    const FINAL_AFTER_H = { NHL: 3.5, NBA: 3.0, NFL: 4.5, NCAAF: 4.5 };
    function gameStatus(g) {
        const t = g.event_start ? new Date(g.event_start).getTime() : null;
        if (t === null || t > Date.now()) return 'up';
        if (g.grade && g.grade.final) return 'final';
        const h = (Date.now() - t) / 3600000;
        return h > (FINAL_AFTER_H[_sport] || 4) ? 'final' : 'live';
    }
    function renderGames() {
        const q = (document.getElementById('search').value || '').trim().toLowerCase();
        const words = q.split(/\s+/).filter(Boolean);
        const games = _games.filter(g => gameMatches(g, words));
        if (!games.length) {
            document.getElementById('games').innerHTML = '<div class="empty">' + (_games.length ? 'No games match "' + q + '".' : 'No games.') + '</div>';
            return;
        }
        let html = '';
        const rec = { win: 0, loss: 0, push: 0 };
        for (const g of _games) {
            for (const k of ['ml', 'spread', 'total']) {
                const r = g.grade && g.grade[k];
                if (r in rec) rec[r]++;
            }
        }
        if (rec.win + rec.loss + rec.push) {
            html += '<div class="record">Picks record (plays + leans, graded): <b>' + rec.win + '-' + rec.loss + (rec.push ? '-' + rec.push : '') + '</b>'
                  + (rec.win + rec.loss ? ' <span class="dim">(' + Math.round(100 * rec.win / (rec.win + rec.loss)) + '%)</span>' : '') + '</div>';
        }
        // ORDER (Rob, Oct 3 2026, mirrored from Bet Sheets): in-play first
        // with a LIVE flag, then upcoming soonest-first under day headers,
        // then finals (most recent first) — "too much scrolling".
        games.forEach(g => { g._st = gameStatus(g); });
        const live = games.filter(g => g._st === 'live');
        const up = games.filter(g => g._st === 'up');
        const fin = games.filter(g => g._st === 'final').reverse();
        let day = null;
        for (const g of live.concat(up, fin)) {
            if (g._st === 'live') {
                if (day !== '__live') { html += '<div class="day-hdr live-hdr">🔴 Live now</div>'; day = '__live'; }
            } else if (g._st === 'final') {
                if (day !== '__final') { html += '<div class="day-hdr">Final</div>'; day = '__final'; }
            } else {
                const dstr = fmtTime(g.event_start);
                if (dstr !== day) { html += '<div class="day-hdr">' + dstr + '</div>'; day = dstr; }
            }
            const rows = _sport === 'NHL' ? hockeyRows(g) : _sport === 'NBA' ? basketballRows(g) : footballRows(g);
            let sub = '';
            if (_sport === 'NHL' && g.goalies) {
                const ga = (g.goalies.away || {}).name, gh = (g.goalies.home || {}).name;
                if (ga || gh) sub = '<span class="sub">🥅 ' + (ga || '?') + ' vs ' + (gh || '?') + '</span>';
            }
            if (_sport === 'NBA' && g.injuries) {
                const oa = (g.injuries.away || []), oh = (g.injuries.home || []);
                if (oa.length || oh.length) sub = '<span class="sub">🩹 OUT ' + nameOf(g, 'away') + ': ' + (oa.join(', ') || '—') + ' · ' + nameOf(g, 'home') + ': ' + (oh.join(', ') || '—') + '</span>';
            }
            const flag = g._st === 'live' ? '<span class="live-flag">LIVE</span>' : '';
            html += '<div class="game' + (g._st === 'final' ? ' done' : '') + '"><div class="ghead"><span class="t">' + (g._st === 'final' ? fmtTime(g.event_start).split(',')[0] + ' ' : '') + fmtClock(g.event_start) + '</span>'
                  + '<span class="m">' + shortTeam(g.away) + ' @ ' + shortTeam(g.home) + '</span>' + flag + finalChip(g) + sub + '</div>'
                  + '<div class="mbox">' + rows + '</div></div>';
        }
        document.getElementById('games').innerHTML = html;
    }

    firebase.auth().onAuthStateChanged(async user => {
        if (!user) { window.location.href = '/'; return; }
        let me = null;
        try {
            const r = await authFetch('/api/me');
            if (!r) { _gateServerError('sign-in check could not reach the server'); return; }
            if (r.status >= 500) { _gateServerError('/api/me returned ' + r.status); return; }
            me = await r.json().catch(() => null);
        } catch (e) { _gateServerError('sign-in check failed: ' + e); return; }
        if (!me || !me.ok || !(me.role === 'admin' || me.bot_access)) { window.location.href = '/'; return; }
        // bot_access = Pick Sheets access (Oct 3 2026): a friend on the pill sees
        // the sheets and nothing else — the Dashboard link renders for admins only.
        if (me.role === 'admin') document.querySelectorAll('.admin-only').forEach(el => el.style.display = '');
        document.getElementById('auth-gate').style.display = 'none';
        document.getElementById('app').style.display = '';
        load();
        setInterval(load, 15 * 60 * 1000);
    });
</script>
</body>
</html>
